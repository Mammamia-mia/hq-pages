      font-size: 13px;
    }

    .non-standard-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

    .form-item {

      flex-direction: column;
      gap: 6px;
      color: #606266;

    .form-item.full {

    .form-item label {

      color: #303133;
    }

    .form-item input,
    .form-item select {
      width: 100%;
      height: 34px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 10px;
      outline: none;
      color: #606266;
      background: #fff;

    .form-item input:focus,
    .form-item select:focus {

    .unit-price-field,
    .quantity-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-price-field input,
    .quantity-field input {
      flex: 1;
      min-width: 0;
    }

    .unit-prefix,
    .quantity-suffix {
      color: #606266;
      font-size: 13px;
      white-space: nowrap;
    }

    .unit-price-field select {
      width: 116px;
      flex: 0 0 116px;
    }

    .store-multi-select {
      position: relative;
    }

    .store-multi-select .multi-select-trigger {
      min-height: 34px;
      text-align: left;
    }

    .store-multi-select .multi-select-panel {
      z-index: 30;
      max-height: 180px;
      overflow: auto;
    }

    .store-multi-select .multi-select-option {
      justify-content: flex-start;
      white-space: nowrap;
    }

    .store-multi-select .multi-select-option input {
      flex: none;
      width: 14px;
      height: 14px;
      padding: 0;
      margin: 0;
    }

    .upload-box {
      min-height: 96px;
      border: 1px dashed #c0c4cc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      cursor: pointer;
      background: #fbfdff;
      transition: 0.16s ease;
    }

    .upload-box:hover {
      border-color: #527DF7;
      background: #eef3ff;
    }

    .upload-preview {
      width: 64px;
      height: 64px;
      border-radius: 4px;
      background: #f5f7fa;
      border: 1px solid #edf0f5;
      display: grid;
      place-items: center;
      color: #909399;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .upload-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #606266;
    }

    .upload-tip {
      color: #909399;
      font-size: 12px;
    }

    .hidden-file-input {
      display: none;
    }

    .batch-config {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 120px 190px auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #edf0f5;
    }

    .batch-purchase-modal {
      width: min(1180px, calc(100vw - 48px));
      height: min(760px, calc(100vh - 48px));
      max-height: calc(100vh - 48px);
    }

    .batch-purchase-modal .modal-header {
      align-items: center;
    }

    .batch-modal-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .batch-modal-title small {
      color: #909399;
      font-size: 12px;
      font-weight: 400;
    }

    .batch-purchase-modal .modal-body {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .batch-type-tabs {
      flex: none;
      display: flex;
      align-items: flex-end;
      gap: 24px;
      min-height: 50px;
      padding: 0 18px;
      border-bottom: 1px solid #ebeef5;
      background: #fff;
    }

    .batch-type-tab {
      position: relative;
      height: 50px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: #606266;
      cursor: pointer;
      font-weight: 500;
    }

    .batch-type-tab.active {
      color: #527df7;
      font-weight: 600;
    }

    .batch-type-tab.active::after {
      content: "";

      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: #527df7;
    }

    .batch-type-tab-count {
      margin-left: 4px;
      color: #909399;
      font-size: 12px;
    }

    .batch-type-tab-dirty {

      right: -8px;

      height: 6px;
      border-radius: 50%;
      background: #f56c6c;
    }

    .batch-editor {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      background: #f5f7fa;
    }

    .batch-prop-nav {
      min-height: 0;
      padding: 14px 12px;
      border-right: 1px solid #ebeef5;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .batch-prop-nav-title {
      margin: 0 6px 10px;
      color: #909399;
      font-size: 12px;
    }

    .batch-prop-toolbar {
      flex: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      gap: 8px;
      margin-bottom: 10px;
    }

    .batch-prop-search,
    .batch-prop-filter {
      width: 100%;
      height: 34px;
      min-width: 0;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: #606266;
      outline: none;
    }

    .batch-prop-search {
      padding: 0 9px;
    }

    .batch-prop-filter {
      padding: 0 6px;
    }

    .batch-prop-search:focus,
    .batch-prop-filter:focus {
      border-color: #527df7;
    }

    .batch-prop-list {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
    }

    .batch-prop-empty {
      padding: 36px 8px;
      color: #909399;
      font-size: 13px;
      text-align: center;
    }

    .batch-prop-item {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ebeef5;
      border-radius: 6px;
      background: #fff;
      color: #303133;
      cursor: pointer;
      text-align: left;
    }

    .batch-prop-item:hover {
      border-color: #b8c9ff;
      background: #f8fbff;
    }

    .batch-prop-item.active {
      border-color: #527df7;
      background: #eef3ff;
      box-shadow: 0 0 0 1px rgba(82, 125, 247, 0.08);
    }

    .batch-prop-item-name {

      align-items: center;
      gap: 6px;
      min-width: 0;
      font-weight: 500;
    }

    .batch-prop-item-name > span:first-child {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .batch-prop-item-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      color: #909399;
      font-size: 12px;
    }

    .batch-prop-item-status .changed {
      color: #527df7;
    }

    .batch-config-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 14px;
      overflow: hidden;
    }

    .batch-active-prop {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #303133;
      font-size: 16px;
      font-weight: 600;
    }

    .batch-field-panel {
      flex: none;
      padding: 12px;
      border: 1px solid #dfe6f2;
      border-radius: 6px;
      background: #fff;
    }

    .batch-field-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .batch-field-panel-title {
      color: #303133;
      font-weight: 600;
    }

    .batch-target-summary {
      color: #909399;
      font-size: 12px;
    }

    .batch-fields {
      display: grid;
      grid-template-columns: minmax(210px, 1.5fr) minmax(130px, 0.75fr) minmax(180px, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .batch-field {
      min-width: 0;
    }

    .batch-field-label {
      min-height: 24px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #606266;
      font-size: 13px;
    }

    .batch-field-label input {
      margin: 0;
    }

    .batch-field-control {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .batch-field-control > span {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .batch-field-control > input,
    .batch-field-control > select {
      width: 100%;
      height: 34px;
      min-width: 0;
      padding: 0 9px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: #606266;
      outline: none;
    }

    .batch-field-control > input:focus,
    .batch-field-control > select:focus {
      border-color: #527df7;
    }

    .batch-field-control > input:disabled,
    .batch-field-control > select:disabled {
      color: #a8abb2;
      background: #f5f7fa;
      cursor: not-allowed;
    }

    .batch-field-readonly {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 9px;
      border: 1px solid #e4e7ed;
      border-radius: 4px;
      background: #f5f7fa;
      color: #909399;
      font-size: 12px;
    }

    .batch-apply-button {
      min-width: 132px;
    }

    .batch-apply-notice {
      flex: none;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding: 8px 11px;
      border: 1px solid #d7e1ff;
      border-radius: 5px;
      background: #eef3ff;
      color: #527df7;
      font-size: 13px;
    }

    .batch-store-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 10px;
      border: 1px solid #ebeef5;
      border-radius: 6px;
      background: #fff;
      overflow: visible;
    }

    .batch-store-head {
      flex: none;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid #ebeef5;
    }

    .batch-store-head strong {
      color: #303133;
      font-size: 14px;
    }

    .batch-store-head span {
      color: #909399;
      font-size: 12px;
    }

    .batch-store-head-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .batch-store-filter {
      position: relative;
      flex: none;
    }

    .batch-store-filter-trigger {
      min-width: 148px;
      height: 32px;
      padding: 0 9px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: #606266;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .batch-store-filter-trigger:hover,
    .batch-store-filter-trigger.open {
      border-color: #527df7;
      color: #527df7;
    }

    .batch-store-filter-panel {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      z-index: 8;
      width: 270px;
      padding: 9px;
      border: 1px solid #e4e7ed;
      border-radius: 5px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.16);
      display: none;
    }

    .batch-store-filter-panel.open {
      display: block;
    }

    .batch-store-filter-search {
      width: 100%;
      height: 32px;
      padding: 0 9px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      outline: none;
    }

    .batch-store-filter-search:focus {
      border-color: #527df7;
    }

    .batch-store-filter-options {
      max-height: 190px;
      margin-top: 7px;
      overflow: auto;
    }

    .batch-store-filter-option {
      min-height: 32px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #606266;
      cursor: pointer;
    }

    .batch-store-filter-option.all {
      margin-bottom: 3px;
      padding-bottom: 3px;
      border-bottom: 1px solid #ebeef5;
      color: #303133;
      font-weight: 500;
    }

    .batch-store-filter-option input {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .batch-store-filter-empty {
      padding: 18px 4px;
      color: #909399;
      text-align: center;
    }

    .batch-store-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .batch-store-table {
      min-width: 760px;
    }

    .batch-store-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .batch-store-table td.is-modified {
      background: #eef3ff;
    }

    .batch-store-table .store-checkbox-cell {
      text-align: center;
    }

    .batch-store-table input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .batch-store-table input:not([type="checkbox"]),
    .batch-store-table select {
      width: 100%;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: #606266;
      outline: none;
    }

    .batch-store-table input:not([type="checkbox"]):focus,
    .batch-store-table select:focus {
      border-color: #527df7;
    }

    .batch-row-qty {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .batch-row-qty span {
      flex: none;
      color: #909399;
      font-size: 12px;
    }

    .batch-footer-summary {
      margin-right: auto;
      color: #909399;
      font-size: 13px;
      line-height: 32px;
    }

    .batch-empty-stores {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #909399;
    }

    .store-config-block {
      border: 1px solid #ebeef5;
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .store-config-title {
      padding: 10px 12px;
      background: #fafafa;
      font-weight: 600;
      border-bottom: 1px solid #ebeef5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .store-config-name {
      flex: 1;
      min-width: 0;
    }

    .store-config-arrow {
      color: #909399;
      transition: transform 0.2s ease;
    }

    .store-config-arrow.collapsed {
      transform: rotate(-90deg);
    }

    .config-table input,
    .config-table select {
      width: 100%;
      height: 32px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 8px;
      outline: none;
      background: #fff;
      color: #606266;
    }

    .config-table input:focus,
    .config-table select:focus {
      border-color: #527DF7;
    }

    .config-table input[readonly] {
      color: #606266;
      background: #f5f7fa;
      cursor: default;
    }

    .spec-readonly-text {
      display: block;
      width: 100%;
      min-height: 32px;
      padding: 6px 0;
      color: #303133;
      line-height: 20px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .config-qty-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-qty-field input {
      flex: 1;
      min-width: 0;
    }

    .config-qty-unit {
      flex: none;
      color: #606266;
      white-space: nowrap;
      font-size: 13px;
    }

    .modal-footer {
      flex: none;
      padding: 12px 18px;
      border-top: 1px solid #ebeef5;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fff;
    }

    :root {
      --surface: rgba(255, 255, 255, 0.94);
      --surface-strong: #fff;
      --line-soft: #e7edf5;
      --line-strong: #d8e2ee;
      --text-strong: #172033;
      --text-main: #334155;
      --text-muted: #7b8798;
      --primary: #527DF7;
      --primary-soft: #eef3ff;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 24px 70px rgba(15, 23, 42, 0.18);
    }

    body {
      color: var(--text-main);
      background: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
    }

    .position-purchase-page {
      padding: 18px;
      gap: 0;
    }

    .selected-stores-bar,
    .left-section,
    .right-section,
    .purchase-modal {
      background: var(--surface);
      border: 1px solid rgba(216, 226, 238, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(10px);
    }

    .selected-stores-bar {
      padding: 14px 18px;
      border-radius: 8px;
    }

    .page-header {
      align-items: center;
      margin-bottom: 10px;
    }

    .title {
      color: var(--text-strong);
      font-size: 17px;
      letter-spacing: 0;
    }

    .selected-count-top,
    .selected-count,
    .pos-location,
    .price-label,
    .modal-prop-meta,
    .upload-tip {
      color: var(--text-muted);
    }

    .selected-count-top span,
    .selected-count-num,
    .price-value {
      color: var(--primary);
      font-weight: 700;
    }

    .mode-tabs-bar {
      margin: -2px 0 12px;
      padding: 0 2px;
      border-bottom: 1px solid var(--line-soft);
    }

    .mode-tabs,
    .tabs {
      gap: 28px;
    }

    .mode-tab,
    .tab {
      color: var(--text-muted);
    }

    .mode-tab.active,
    .tab.active,
    .mode-tab:hover,
    .tab:hover {
      color: var(--primary);
    }

    .mode-tab.active::after,
    .tab.active::after {
      background: var(--primary);
    }

    .btn {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: #465466;
      background: linear-gradient(180deg, #fff, #f8fafc);
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(82, 125, 247, 0.12);
      transform: translateY(-1px);
    }

    .btn-primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(82, 125, 247, 0.22);
    }

    .btn-primary:hover {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:disabled {
      border-color: var(--primary);
      background: var(--primary);
      box-shadow: none;
      color: #fff;
      opacity: 0.45;
    }

    .btn-outline-primary {
      border-color: var(--primary);
      background: #fff;
      color: var(--primary);
      box-shadow: none;
    }

    .btn-outline-primary:hover {
      border-color: var(--primary);
      background: #eef3ff;
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(82, 125, 247, 0.12);
    }

    .btn-link {
      color: var(--primary);
      background: transparent;
      box-shadow: none;
    }

    .tag-item {
      min-height: 30px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: #f8fafc;
    }

    .tag {
      border-radius: 999px;
      font-weight: 600;
    }

    .main-content {
      gap: 14px;
    }

    .left-section,
    .right-section {
      overflow: hidden;
    }

    .tabs,
    .filter-toolbar,
    .left-footer,
    .detail-header,
    .group-header,
    .modal-header,
    .modal-footer {
      border-color: var(--line-soft);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.92));
    }

    .input,
    .select,
    .multi-select-trigger,
    .store-purchase-qty,
    .form-item input,
    .form-item select,
    .config-table input,
    .config-table select {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: var(--text-main);
      background: #fff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .input:focus,
    .select:focus,
    .multi-select-trigger.open,
    .store-purchase-qty:focus,
    .form-item input:focus,
    .form-item select:focus,
    .config-table input:focus,
    .config-table select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(82, 125, 247, 0.12);
    }

    .position-item {
      margin: 2px 8px;
      border-radius: 6px;
    }

    .position-item:hover {
      background: #f8fbff;
    }

    .position-item.active {
      color: var(--primary);
      background: var(--primary-soft);
      box-shadow: inset 0 0 0 1px rgba(82, 125, 247, 0.12);
    }

      keyword: "",
      location: "",
      selectedFilter: "",
      propTypes: [],
      propTypePanelOpen: false,
      warehouseTypes: [],
      warehouseTypePanelOpen: false,
      applicableArea: "",
      activePurchase: null,
      activeWarehouseConfig: null,
      activeNonStandardAdd: null,
      nonStandardKeyword: "",
      storePropConfigs: {},
      storeGroupPurchaseQty: {},
      globalNonStandardProps: [],
      collapsedStoreConfigs: new Set(),
      expandedGroups: new Set(),
      expandedConfig: new Set(),
      selections: {
        "POS-A01_美陈道具": ["S001"],
        "POS-C03_工程道具": ["S001", "S003"]
      }
    };

    const els = {
      selectedStoreCount: document.getElementById("selectedStoreCount"),
      storeTags: document.getElementById("storeTags"),
      modeTabs: document.getElementById("modeTabs"),
      mainContent: document.getElementById("mainContent"),
      imageTabs: document.getElementById("imageTabs"),
      keywordInput: document.getElementById("keywordInput"),
      searchBtn: document.getElementById("searchBtn"),
      locationSelect: document.getElementById("locationSelect"),
      selectedSelect: document.getElementById("selectedSelect"),
      propTypeFilter: document.getElementById("propTypeFilter"),
      propTypeTrigger: document.getElementById("propTypeTrigger"),
      propTypeLabel: document.getElementById("propTypeLabel"),
      propTypePanel: document.getElementById("propTypePanel"),
      typeFilterRow: document.getElementById("typeFilterRow"),
      warehouseTypeFilter: document.getElementById("warehouseTypeFilter"),
      warehouseTypeTrigger: document.getElementById("warehouseTypeTrigger"),
      warehouseTypeLabel: document.getElementById("warehouseTypeLabel"),
      warehouseTypePanel: document.getElementById("warehouseTypePanel"),
      applicableAreaSelect: document.getElementById("applicableAreaSelect"),
      positionList: document.getElementById("positionList"),
      purchasedPositionCount: document.getElementById("purchasedPositionCount"),
      detailPanel: document.getElementById("detailPanel"),
      purchaseModal: document.getElementById("purchaseModal"),
      toast: document.getElementById("toast"),
      draftSaveBtn: document.getElementById("draftSaveBtn"),
      reselectBtn: document.getElementById("reselectBtn")
    };

    const DRAFT_STORAGE_KEY = "MAIN_POS_POSITION_PURCHASE_DRAFTS";

    function warehouseIcon(type) {
      const stroke = "#527DF7";
      const fill = "#eef3ff";
      if (type === "shelf") {
        return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="9" width="32" height="30" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="2"/><path d="M10 19h28M10 29h28M16 9v30M32 9v30" stroke="${stroke}" stroke-width="2"/></svg>`;
      }
      if (type === "counter") {
        return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="18" width="32" height="18" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="2"/><path d="M14 13h20l3 5H11l3-5Z" fill="#fff" stroke="${stroke}" stroke-width="2"/><path d="M16 26h16" stroke="${stroke}" stroke-width="2"/></svg>`;
      }
      if (type === "sign") {
        return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="12" y="8" width="24" height="28" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="2"/><path d="M18 17h12M18 24h8M24 36v5" stroke="${stroke}" stroke-width="2"/></svg>`;
      }
      return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="28" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="2"/><path d="M12 33l8-10 6 7 4-5 6 8" fill="none" stroke="${stroke}" stroke-width="2"/><circle cx="31" cy="18" r="3" fill="${stroke}"/></svg>`;
    }

    function propIcon(type) {
      const map = {
        "美陈道具": ["#f56c6c", "#fef0f0"],
        "陈列道具": ["#67c23a", "#f0f9eb"],
        "工程道具": ["#909399", "#f4f4f5"],
        "平面道具": ["#e6a23c", "#fdf6ec"]
      };
      const [stroke, fill] = map[type] || ["#527DF7", "#eef3ff"];
      return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="10" width="28" height="28" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="2"/><path d="M17 19h14M17 25h14M17 31h9" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/></svg>`;
    }

    function formatMoney(value) {
      return `¥${Number(value || 0).toFixed(2)}`;
    }

    function formatUnitPrice(prop) {
      return `${formatMoney(prop?.price || 0)}/每${prop?.unit || "个"}`;
    }

    function formatQtyWithUnit(prop) {
      return `${prop?.qty ?? 1}${prop?.unit || "个"}`;
    }

    function validatePurchaseQty(value) {
      const normalized = String(value ?? "").trim();
      if (!normalized || Number.isNaN(Number(normalized))) return "请输入采购数量";
      if (Number(normalized) < 0) return "采购数量不能小于0";
      if (!/^\d+(?:\.\d{1,2})?$/.test(normalized)) return "采购数量最多支持2位小数";
      return "";
    }

    function escapeAttr(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatApplicableAreaLabel(areas) {
      const list = (areas || []).filter(Boolean);
      if (!list.length) return "-";
      if (list.length === 1) return list[0];
      return `适用${list.length}个区域`;
    }

    function selectedStoresForCurrentImage() {
      return state.currentImage ? stores.filter(store => store.storeForm === state.currentImage) : stores;
    }

    function getWarehouseGroups(code) {
      return specs[code] || [];
    }

    function groupKey(code, type) {
      return `${code}_${type}`;
    }

    function storeGroupQtyKey(groupKeyValue, storeId) {
      return `${groupKeyValue}__${storeId}`;
    }

    function selectedWarehouseCodes() {
      const codes = new Set();
      Object.entries(state.selections).forEach(([key, storeIds]) => {
        if (storeIds && storeIds.length) {
          codes.add(key.split("_")[0]);
        }
      });
      return codes;
    }

    function filteredWarehouses() {
      const selectedCodes = selectedWarehouseCodes();
      return warehouses.filter(warehouse => {
        if (state.currentImage && !warehouse.formCodes.includes(state.currentImage)) return false;
        if (state.keyword) {
          const keyword = state.keyword.toLowerCase();
          const matched = [warehouse.warehouseName, warehouse.warehouseCode].some(value => String(value || "").toLowerCase().includes(keyword));
          if (!matched) return false;
        }
        if (state.location && warehouse.location !== state.location) return false;
        if (state.warehouseTypes.length && !state.warehouseTypes.includes(warehouse.warehouseType)) return false;
        if (state.applicableArea && !(warehouse.applicableAreas || []).includes(state.applicableArea)) return false;
        if (state.selectedFilter === "selected" && !selectedCodes.has(warehouse.warehouseCode)) return false;
        if (state.selectedFilter === "unselected" && selectedCodes.has(warehouse.warehouseCode)) return false;
        if (state.propTypes.length) {
          const warehouseTypes = getWarehouseGroups(warehouse.warehouseCode).map(group => group.propTypeDesc);
          if (!state.propTypes.some(type => warehouseTypes.includes(type))) return false;
        }
        return true;
      });
    }

    function ensureCurrentPosition() {
      const list = filteredWarehouses();
      if (!list.some(item => item.warehouseCode === state.currentPositionCode)) {
        state.currentPositionCode = list[0]?.warehouseCode || "";
      }
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2600);
    }

    function readDrafts() {
      try {
        return JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function writeDrafts(drafts) {
      localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts));
    }

    function draftSnapshot() {
      return {
        currentImage: state.currentImage,
        purchaseMode: state.purchaseMode,
        currentPositionCode: state.currentPositionCode,
        keyword: state.keyword,
        location: state.location,
        selectedFilter: state.selectedFilter,
        propTypes: state.propTypes,
        warehouseTypes: state.warehouseTypes,
        applicableArea: state.applicableArea,
        nonStandardKeyword: state.nonStandardKeyword,
        storePropConfigs: state.storePropConfigs,
        storeGroupPurchaseQty: state.storeGroupPurchaseQty,
        globalNonStandardProps: state.globalNonStandardProps,
        collapsedStoreConfigs: [...state.collapsedStoreConfigs],
        expandedGroups: [...state.expandedGroups],
        expandedConfig: [...state.expandedConfig],
        selections: state.selections
      };
    }

    function saveDraft() {
      persistInlineWarehouseConfig();
      const count = state.purchaseMode === "nonStandard" ? state.globalNonStandardProps.length : purchasedPositionCount();
      const mode = state.purchaseMode === "nonStandard" ? "定制道具" : "标准仓位";
      const drafts = readDrafts();
      drafts.unshift({
        id: `position_${Date.now()}`,
        title: `仓位采购草稿-${mode}-${count}项`,
        stage: "采购入口",
        count,
        updatedAt: new Date().toLocaleString("zh-CN", { hour12: false }),
        snapshot: draftSnapshot()
      });
      writeDrafts(drafts.slice(0, 10));
      showToast("已暂存，可在原始订单列表的暂存记录中继续编辑");
    }

    function restoreDraft(id) {
      const draft = readDrafts().find(item => item.id === id);
      if (!draft) return showToast("草稿不存在");
      const data = draft.snapshot || {};
      Object.assign(state, data);
      state.collapsedStoreConfigs = new Set(data.collapsedStoreConfigs || []);
      state.expandedGroups = new Set(data.expandedGroups || []);
      state.expandedConfig = new Set(data.expandedConfig || []);
      state.activePurchase = null;
      state.activeWarehouseConfig = null;
      state.activeNonStandardAdd = null;
      closePurchaseModal();
      render();
      showToast("已恢复暂存草稿");
    }

    function deleteDraft(id) {
      writeDrafts(readDrafts().filter(item => item.id !== id));
      renderDraftList();
      showToast("草稿已删除");
    }

    function renderDraftList() {
      const drafts = readDrafts();
      els.purchaseModal.classList.add("open");
      els.purchaseModal.innerHTML = `<div class="purchase-modal">
        <div class="modal-header">
          <span>暂存记录</span>
          <button class="modal-close" data-modal-close type="button">×</button>
        </div>
        <div class="modal-body">
          ${drafts.length ? `<table class="config-table">
            <thead><tr><th>草稿名称</th><th style="width:120px;">阶段</th><th style="width:160px;">更新时间</th><th style="width:140px;">操作</th></tr></thead>
            <tbody>${drafts.map(draft => `<tr>
              <td>${escapeHtml(draft.title)}</td>
              <td>${escapeHtml(draft.stage)}</td>
              <td>${escapeHtml(draft.updatedAt)}</td>
              <td><button class="btn btn-link" data-restore-draft="${draft.id}" type="button">继续编辑</button><button class="btn btn-link danger-link" data-delete-draft="${draft.id}" type="button">删除</button></td>
            </tr>`).join("")}</tbody>
          </table>` : `<div class="empty-data-tip">暂无暂存记录</div>`}
        </div>
      </div>`;
    }

    function renderStores() {
      els.selectedStoreCount.textContent = stores.length;
      els.storeTags.innerHTML = stores.map(store => {
        const type = storeTypes[store.storeType] || storeTypes.JM;
        return `<div class="tag-item">
          <span class="tag ${type.className}">${type.label}</span>
          <span class="tag-store-name">${store.storeName}</span>
        </div>`;
      }).join("");
    }

    function renderTabs() {
      els.modeTabs.innerHTML = modeTabs.map(tab => (
        `<button class="mode-tab ${tab.value === state.purchaseMode ? "active" : ""}" data-mode="${tab.value}" type="button">${tab.label}</button>`
      )).join("");
      els.imageTabs.style.display = state.purchaseMode === "standard" ? "" : "none";
      els.imageTabs.innerHTML = imageTabs.map(tab => (
        `<button class="tab ${tab.value === state.currentImage ? "active" : ""}" data-image="${tab.value}">${tab.label}</button>`
      )).join("");
    }

    function renderLocations() {
      const locations = [...new Set(warehouses
        .filter(warehouse => !state.currentImage || warehouse.formCodes.includes(state.currentImage))
        .map(warehouse => warehouse.location))];
      els.locationSelect.innerHTML = `<option value="">全部位置</option>${locations.map(location => (
        `<option value="${location}" ${location === state.location ? "selected" : ""}>${location}</option>`
      )).join("")}`;
    }

    function renderPropTypeFilter() {
      els.propTypeLabel.textContent = state.propTypes.length ? state.propTypes.join("、") : "全部道具类型";
      els.propTypeTrigger.classList.toggle("open", state.propTypePanelOpen);
      els.propTypePanel.classList.toggle("open", state.propTypePanelOpen);
      els.propTypePanel.innerHTML = propTypeFilterOptions.map(type => (
        `<label class="multi-select-option">
          <input type="checkbox" value="${type}" ${state.propTypes.includes(type) ? "checked" : ""}>
          ${type}
        </label>`
      )).join("");
    }

    function renderWarehouseTypeFilter() {
      els.warehouseTypeLabel.textContent = state.warehouseTypes.length ? state.warehouseTypes.join("、") : "全部仓位类型";
      els.warehouseTypeTrigger.classList.toggle("open", state.warehouseTypePanelOpen);
      els.warehouseTypePanel.classList.toggle("open", state.warehouseTypePanelOpen);
      els.warehouseTypePanel.innerHTML = warehouseTypeOptions.map(type => (
        `<label class="multi-select-option">
          <input type="checkbox" value="${type}" ${state.warehouseTypes.includes(type) ? "checked" : ""}>
          ${type}
        </label>`
      )).join("");
    }

    function renderApplicableAreaFilter() {
      els.applicableAreaSelect.innerHTML = `<option value="">全部适用区域</option>${applicableAreaOptions.map(area => (
        `<option value="${area}" ${state.applicableArea === area ? "selected" : ""}>${area}</option>`
      )).join("")}`;
    }

    function renderPositions() {
      if (state.purchaseMode === "nonStandard") {
        const list = state.globalNonStandardProps.filter(prop => !state.keyword || prop.propName.includes(state.keyword));
        if (list.length === 0) {
          els.positionList.innerHTML = `<div class="empty-data-tip">暂无定制道具</div>`;
          return;
        }
        els.positionList.innerHTML = list.map((prop, index) => (
          `<div class="position-item ${index === 0 ? "active" : ""}">
            <div class="pos-image">${propIcon(prop.propType)}</div>
            <div class="pos-info">
              <div class="pos-name">
                <span class="text-ellipsis">${prop.propName}</span>
                <span class="tag tag-info">非标</span>
              </div>
              <div class="pos-location">${prop.propType || "未分类"} / ${formatMoney(prop.price || 0)} x ${prop.qty || 0}</div>
            </div>
          </div>`
        )).join("");
        return;
      }

      const list = filteredWarehouses();
      const selectedCodes = selectedWarehouseCodes();
      if (!list.length) {
        els.positionList.innerHTML = `<div class="empty-data-tip">暂无仓位数据</div>`;
        return;
      }
      els.positionList.innerHTML = list.map(pos => (
        `<div class="position-item ${pos.warehouseCode === state.currentPositionCode ? "active" : ""}" data-code="${pos.warehouseCode}">
          <div class="pos-image">${warehouseIcon(pos.icon)}</div>
          <div class="pos-info">
            <div class="pos-name">
              <span class="text-ellipsis">${pos.warehouseName}</span>
              ${selectedCodes.has(pos.warehouseCode) ? `<span class="tag tag-success">已选</span>` : ""}
            </div>
            <div class="pos-meta-tags" title="位置：${escapeHtml(pos.location || "-")}；类型：${escapeHtml(pos.warehouseType || "未分类")}；适用区域：${escapeHtml((pos.applicableAreas || []).join("、") || "-")}">
              <span class="tag tag-info pos-meta-tag">${escapeHtml(pos.location || "-")}</span>
              <span class="tag tag-primary pos-meta-tag">${escapeHtml(pos.warehouseType || "未分类")}</span>
              <span class="pos-area-row">
                <span class="tag tag-info pos-meta-tag pos-area-tag" data-area-tooltip="${escapeHtml((pos.applicableAreas || []).join("、") || "-")}">${escapeHtml(formatApplicableAreaLabel(pos.applicableAreas))}</span>
              </span>
            </div>
          </div>
        </div>`
      )).join("");
    }

    function groupTotal(group) {
      return (group.specList || []).reduce((sum, prop) => sum + Number(prop.price || 0) * Number(prop.qty || 1), 0);
    }

    function propConfigKey(warehouseCode, propType, propName) {
      return `${warehouseCode}__${propType}__${propName}`;
    }

    function getPropConfig(configKey) {
      return state.storePropConfigs[configKey] || {};
    }

    function getPurchasedPropQty(configKey, selectedStoreIds, prop) {
      const configs = getPropConfig(configKey);
      return selectedStoreIds.reduce((sum, storeId) => {
        const defaultQty = getPropPurchaseType(prop) === "standard" ? Number(prop.qty || 0) : 0;
        return sum + Number(configs[storeId]?.qty ?? defaultQty);
      }, 0);
    }

    function getAllSuppliers(extraSupplier) {
      return [...new Set(["简造陈列供应商", "山城广告制作", "华南印务", "简造五金", "简造工程配套", extraSupplier].filter(Boolean))];
    }

    function getPropPurchaseType(prop) {
      if (prop?.purchaseType) return prop.purchaseType;
      if (prop?.isNonStandard === true) return "nonStandard";
      if (Number(prop?.qty || 0) === 0) return "optional";
      return "standard";
    }

    function isNonStandardProp(prop) {
      return getPropPurchaseType(prop) === "nonStandard";
    }

    function canEditPropSpec(prop) {
      return getPropPurchaseType(prop) === "nonStandard";
    }

    function propSpecReadonlyMeta(prop) {
      return getPropPurchaseType(prop) === "standard"
        ? {
          text: "标准道具使用仓位标配规格",
          title: "标准道具规格由仓位标配确定，不支持修改"
        }
        : {
          text: "可选道具使用标准规格",
          title: "可选道具使用标准规格，不支持修改"
        };
    }

    function propPurchaseTypeTag(prop) {
      const type = getPropPurchaseType(prop);
      const typeMeta = {
        standard: { label: "标准", className: "prop-type-standard" },
        nonStandard: { label: "非标", className: "prop-type-non-standard" },
        optional: { label: "可选", className: "prop-type-optional" }
      }[type];
      return `<span class="prop-type-tag ${typeMeta.className}" data-prop-purchase-type="${type}">${typeMeta.label}</span>`;
    }

    function propPurchaseActionLabel(prop) {
      return {
        standard: "调整配置",
        nonStandard: "配置并采购",
        optional: "采购"
      }[getPropPurchaseType(prop)];
    }

    function ensurePropConfig(warehouseCode, propType, prop) {
      const configKey = propConfigKey(warehouseCode, propType, prop.propName);
      if (!state.storePropConfigs[configKey]) {
        state.storePropConfigs[configKey] = {};
      }
      stores.forEach(store => {
        if (!state.storePropConfigs[configKey][store.id]) {
          state.storePropConfigs[configKey][store.id] = {
            specDesc: prop.specDesc || "",
            qty: prop.qty ?? 1,
            supplierName: prop.supplierName || ""
          };
        }
      });
      return configKey;
    }

    function getWarehouseConfigRows(warehouseCode) {
      return getWarehouseGroups(warehouseCode).flatMap(group => {
        return (group.specList || []).map(prop => ({
          propType: group.propTypeDesc,
          prop,
          configKey: ensurePropConfig(warehouseCode, group.propTypeDesc, prop)
        }));
      });
    }

    function openPurchaseModal(warehouseCode, propType, propName) {
      const group = getWarehouseGroups(warehouseCode).find(item => item.propTypeDesc === propType);
      const prop = group?.specList?.find(item => item.propName === propName);
      if (!group || !prop) return;
      ensurePropConfig(warehouseCode, propType, prop);
      state.activePurchase = { warehouseCode, propType, propName };
      renderPurchaseModal();
    }

    function closePurchaseModal() {
      state.activePurchase = null;
      state.activeWarehouseConfig = null;
      state.activeNonStandardAdd = null;
      renderPurchaseModal();
    }

    function renderPurchaseModal() {
      if (!state.activePurchase && !state.activeWarehouseConfig && !state.activeNonStandardAdd) {
        els.purchaseModal.classList.remove("open");
        els.purchaseModal.innerHTML = "";
        return;
      }

      if (state.activeNonStandardAdd) {
        renderNonStandardAddModal();
        return;
      }

      if (state.activeWarehouseConfig) {
        renderWarehouseConfigModal();
        return;
      }

      const { warehouseCode, propType, propName } = state.activePurchase;
      const group = getWarehouseGroups(warehouseCode).find(item => item.propTypeDesc === propType);
      const prop = group?.specList?.find(item => item.propName === propName);
      const specReadonly = prop && !canEditPropSpec(prop);
      const configKey = propConfigKey(warehouseCode, propType, propName);
      const configs = getPropConfig(configKey);
      const suppliers = getAllSuppliers(prop?.supplierName);

      els.purchaseModal.classList.add("open");
      els.purchaseModal.innerHTML = `<div class="purchase-modal">
        <div class="modal-header">
          <span>采购配置</span>
          <button class="modal-close" data-modal-close type="button">×</button>
        </div>
        <div class="modal-body">
          <div class="modal-prop-summary">
            <div class="prop-image">${propIcon(propType)}</div>
            <div>
              <div class="modal-prop-name">${propName}</div>
              <div class="modal-prop-meta">${propType} / ${formatUnitPrice(prop)}</div>
            </div>
          </div>
          <table class="config-table">
            <thead>
              <tr>
                <th style="width: 24%;">门店</th>
                <th>${specReadonly ? "规格说明" : `<span class="required-star">*</span>规格说明`}</th>
                <th style="width: 150px;">数量</th>
                <th style="width: 190px;">供应商</th>
              </tr>
            </thead>
            <tbody>
              ${stores.filter(store => (state.selections[groupKey(warehouseCode, propType)] || []).includes(store.id)).map(store => {
                const config = configs[store.id] || {};
                return `<tr>
                  <td class="text-ellipsis">${store.storeName}</td>
                  <td>${specReadonly ? `<span class="spec-readonly-text">${escapeHtml(config.specDesc || prop?.specDesc || "-")}</span>` : `<input data-config-field="specDesc" data-store-id="${store.id}" value="${config.specDesc || prop?.specDesc || ""}" />`}</td>
                  <td><div class="config-qty-field"><input data-config-field="qty" data-store-id="${store.id}" type="number" min="0" step="0.01" inputmode="decimal" value="${config.qty ?? 1}" /><span class="config-qty-unit">${prop?.unit || "个"}</span></div></td>
                  <td>
                    <select data-config-field="supplierName" data-store-id="${store.id}">
                      ${suppliers.map(supplier => `<option value="${supplier}" ${supplier === (config.supplierName || prop?.supplierName) ? "selected" : ""}>${supplier}</option>`).join("")}
                    </select>
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button class="btn" data-modal-close type="button">取消</button>
          <button class="btn btn-primary" data-modal-save type="button">保存</button>
        </div>
      </div>`;
    }

    function savePurchaseConfig() {
      const qtyInputs = [...els.purchaseModal.querySelectorAll('[data-config-field="qty"]')];
      for (const input of qtyInputs) {
        const qtyError = validatePurchaseQty(input.value);
        if (qtyError) {
          input.focus();
          showToast(qtyError);
          return;
        }
      }
      closePurchaseModal();
      render();
      showToast("采购配置已保存");
    }

      const editingProp = Number.isInteger(index) ? state.globalNonStandardProps[index] : null;
      state.activeNonStandardAdd = {
        index,
        storeIds: editingProp?.storeIds ? [...editingProp.storeIds] : [],
        storePanelOpen: false
      };
      state.activePurchase = null;
      state.activeWarehouseConfig = null;
      renderPurchaseModal();
    }

            </div>
            <div class="form-item">
              <label>道具名称</label>
              <input data-non-standard-field="propName" placeholder="请输入道具名称" value="${escapeAttr(editingProp?.propName)}" />
            </div>
            <div class="form-item">
              <label>道具类型</label>
              <select data-non-standard-field="propType">
                ${propTypeOptions.filter(type => type !== "非标").map(type => `<option value="${type}" ${type === editingProp?.propType ? "selected" : ""}>${type}</option>`).join("")}

            <div class="form-item full">

              <input data-non-standard-field="specDesc" placeholder="请输入规格说明" value="${escapeAttr(editingProp?.specDesc)}" />

              <div class="upload-box" data-upload-trigger>

                <select data-non-standard-field="unit">
                  <option value="" ${editingProp?.unit ? "" : "selected"}>请选择单位</option>
                  ${["平米", "米", "个", "对"].map(unit => `<option value="${unit}" ${unit === editingProp?.unit ? "selected" : ""}>${unit}</option>`).join("")}
                </select>

              <label>数量</label>
              <div class="quantity-field">
                <input data-non-standard-field="qty" type="number" min="0" step="0.01" inputmode="decimal" value="${editingProp?.qty ?? 1}" />

    function saveNonStandardProp() {
      if (!state.activeNonStandardAdd) return;
      const read = field => els.purchaseModal.querySelector(`[data-non-standard-field="${field}"]`)?.value?.trim() || "";
      const storeIds = state.activeNonStandardAdd.storeIds || [];
      if (storeIds.length === 0) {
        showToast("请选择采购门店");
        return;
      }
      const propName = read("propName");
      if (!propName) {
        showToast("请填写道具名称");
        return;
      }
      const qtyValue = read("qty");
      const qtyError = validatePurchaseQty(qtyValue);
      if (qtyError) {
        els.purchaseModal.querySelector('[data-non-standard-field="qty"]')?.focus();
        showToast(qtyError);
        return;
      }
      const prop = {
        propName,
        propType: read("propType"),
        specDesc: read("specDesc"),
        imageName: els.purchaseModal.querySelector('[data-non-standard-field="imageName"]')?.files?.[0]?.name || (Number.isInteger(state.activeNonStandardAdd.index) ? state.globalNonStandardProps[state.activeNonStandardAdd.index]?.imageName : "") || "",
        price: Number(read("price") || 0),
        unit: read("unit"),
        qty: Number(qtyValue),
        supplierName: read("supplierName"),
        storeIds,
        storeNames: stores.filter(store => storeIds.includes(store.id)).map(store => store.storeName)
      };
      const isEdit = Number.isInteger(state.activeNonStandardAdd.index);
      if (isEdit) {
        state.globalNonStandardProps[state.activeNonStandardAdd.index] = prop;
      } else {
        state.globalNonStandardProps.push(prop);
      }
      closePurchaseModal();
      render();
      showToast(isEdit ? "定制道具已更新" : "定制道具已添加");
    }

    function renderGlobalNonStandardSection() {
      const keyword = state.nonStandardKeyword.trim();
      const customRows = state.globalNonStandardProps
        .map((prop, index) => ({ prop, index }))
        .filter(({ prop }) => !keyword || (prop.propName || "").includes(keyword));
      const listHtml = state.globalNonStandardProps.length === 0
        ? `<div class="empty-data-tip">暂无定制道具</div>`
        : customRows.length === 0
          ? `<div class="empty-data-tip">未找到匹配的定制道具</div>`
          : `<div class="prop-table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 180px;">采购门店</th>

                <th style="width: 140px;">每单位价格（元）</th>

                const specDesc = prop.specDesc || "-";

                const qty = `${prop.qty || 0}${prop.unit || "个"}`;
                const supplierName = prop.supplierName || "-";
                return `<tr>

                  <td title="${escapeHtml(propType)}">${escapeHtml(propType)}</td>
                  <td><span class="text-ellipsis prop-spec-tooltip" tabindex="0" data-tooltip="${escapeHtml(specDesc)}" title="${escapeHtml(specDesc)}">${escapeHtml(specDesc)}</span></td>
                  <td><div class="custom-image-cell">${propIcon(prop.propType)}</div></td>
                  <td title="${escapeHtml(price)}">${price}</td>
                  <td title="${escapeHtml(qty)}">${qty}</td>
                  <td class="text-ellipsis" title="${escapeHtml(supplierName)}">${escapeHtml(supplierName)}</td>
                  <td><div class="table-actions"><button class="btn btn-link" data-edit-non-standard="${index}" type="button">编辑</button><button class="btn btn-link danger-link" data-delete-non-standard="${index}" type="button">删除</button></div></td>
