    function nonStandardFilterHtml() {
      return `<div class="custom-list-filter">
        <label for="nonStandardKeywordInput">道具名称</label>
        <input class="input" id="nonStandardKeywordInput" data-non-standard-keyword placeholder="请输入道具名称" value="${escapeHtml(state.nonStandardKeyword)}" />
      </div>`;
    }

    function createWarehouseBatchState(warehouseCode, mode = "modal") {
      const groups = getWarehouseGroups(warehouseCode);
      if (!groups.length) return null;
      const initialGroup = groups.find(group => (state.selections[groupKey(warehouseCode, group.propTypeDesc)] || []).length > 0) || groups[0];
      const draftConfigs = buildWarehouseBatchConfigs(warehouseCode);
      return {
        mode,
        warehouseCode,
        activePropType: initialGroup.propTypeDesc,
        activePropName: initialGroup.specList?.[0]?.propName || "",
        draftConfigs,
        originalConfigs: cloneData(draftConfigs),
        selectedStoreIdsByType: Object.fromEntries(groups.map(group => [
          group.propTypeDesc,
          [...(state.selections[groupKey(warehouseCode, group.propTypeDesc)] || [])]
        ])),
        storeFilterIdsByType: Object.fromEntries(groups.map(group => [
          group.propTypeDesc,
          [...(state.selections[groupKey(warehouseCode, group.propTypeDesc)] || [])]
        ])),
        propKeyword: "",
        propPurchaseTypeFilter: "",
        storeFilterOpen: false,
        storeKeyword: "",
        batchEnabled: { specDesc: false, qty: false, supplierName: false },
        batchValues: { specDesc: "", qty: "", supplierName: "" },
        lastBatchSnapshot: null,
        recentBatchCells: [],
        batchNotice: "",
        storeSelectorExpanded: true,
        batchPanelExpanded: false,
        dirty: false
      };
    }

    function openWarehouseConfigModal(warehouseCode) {
      state.activeWarehouseConfig = createWarehouseBatchState(warehouseCode, "modal");
      if (!state.activeWarehouseConfig) return;
      state.activePurchase = null;
      resetWarehouseBatchFields();
      renderPurchaseModal();
    }

    function persistInlineWarehouseConfig() {
      const active = state.activeWarehouseConfig;
      if (!active || active.mode !== "inline") return;
      Object.entries(active.draftConfigs).forEach(([configKey, configs]) => {
        state.storePropConfigs[configKey] = cloneData(configs);
      });
    }

    function ensureInlineWarehouseConfig(warehouseCode) {
      const groups = getWarehouseGroups(warehouseCode);
      let active = state.activeWarehouseConfig;
      if (!active || active.mode !== "inline" || active.warehouseCode !== warehouseCode) {
        persistInlineWarehouseConfig();
        active = createWarehouseBatchState(warehouseCode, "inline");
        state.activeWarehouseConfig = active;
      }
      if (!active) return null;

      groups.forEach(group => {
        const propType = group.propTypeDesc;
        const available = [...(state.selections[groupKey(warehouseCode, propType)] || [])];
        const previousAvailable = active.availableStoreIdsByType?.[propType] || [];
        const syncSelection = source => {
          const result = (source || []).filter(storeId => available.includes(storeId));
          available.forEach(storeId => {
            if (!previousAvailable.includes(storeId) && !result.includes(storeId)) result.push(storeId);
          });
          return result;
        };
        active.selectedStoreIdsByType[propType] = syncSelection(active.selectedStoreIdsByType[propType]);
        active.storeFilterIdsByType[propType] = syncSelection(active.storeFilterIdsByType[propType]);
      });
      active.availableStoreIdsByType = Object.fromEntries(groups.map(group => [
        group.propTypeDesc,
        [...(state.selections[groupKey(warehouseCode, group.propTypeDesc)] || [])]
      ]));
      return active;
    }

    function renderWarehouseConfigSurface() {
      if (state.activeWarehouseConfig?.mode === "inline") render();
      else renderWarehouseConfigModal();
    }

    function cloneData(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function buildWarehouseBatchConfigs(warehouseCode) {
      const result = {};
      getWarehouseGroups(warehouseCode).forEach(group => {
        (group.specList || []).forEach(prop => {
          const configKey = propConfigKey(warehouseCode, group.propTypeDesc, prop.propName);
          const savedConfigs = state.storePropConfigs[configKey] || {};
          result[configKey] = {};
          stores.forEach(store => {
            const saved = savedConfigs[store.id] || {};
            result[configKey][store.id] = {
              specDesc: saved.specDesc ?? prop.specDesc ?? "",
              qty: saved.qty ?? (getPropPurchaseType(prop) === "standard" ? Number(prop.qty || 0) : 0),
              supplierName: saved.supplierName ?? prop.supplierName ?? ""
            };
          });
        });
      });
      return result;
    }

    function getActiveWarehouseBatchGroup() {
      const active = state.activeWarehouseConfig;
      return getWarehouseGroups(active?.warehouseCode).find(group => group.propTypeDesc === active?.activePropType);
    }

    function getActiveWarehouseBatchProp() {
      const active = state.activeWarehouseConfig;
      return getActiveWarehouseBatchGroup()?.specList?.find(prop => prop.propName === active?.activePropName);
    }

    function getWarehouseBatchConfigKey(prop = getActiveWarehouseBatchProp()) {
      const active = state.activeWarehouseConfig;
      return propConfigKey(active.warehouseCode, active.activePropType, prop.propName);
    }

    function getWarehouseBatchAvailableStoreIds(propType = state.activeWarehouseConfig?.activePropType) {
      const active = state.activeWarehouseConfig;
      return [...(state.selections[groupKey(active.warehouseCode, propType)] || [])];
    }

    function getWarehouseBatchSelectedStoreIds() {
      const active = state.activeWarehouseConfig;
      const visible = new Set(getWarehouseBatchVisibleStoreIds());
      return (active.selectedStoreIdsByType[active.activePropType] || []).filter(storeId => visible.has(storeId));
    }

    function getWarehouseBatchVisibleStoreIds() {
      const active = state.activeWarehouseConfig;
      const availableStoreIds = getWarehouseBatchAvailableStoreIds();
      const filterIds = new Set(active.storeFilterIdsByType[active.activePropType] || []);
      return availableStoreIds.filter(storeId => filterIds.has(storeId));
    }

    function getWarehouseBatchFilteredProps() {
      const active = state.activeWarehouseConfig;
      const keyword = String(active.propKeyword || "").trim().toLowerCase();
      return (getActiveWarehouseBatchGroup()?.specList || []).filter(prop => {
        if (active.propPurchaseTypeFilter && getPropPurchaseType(prop) !== active.propPurchaseTypeFilter) return false;
        if (!keyword) return true;
        return [prop.specCode, prop.propName].some(value => String(value || "").toLowerCase().includes(keyword));
      });
    }

    function syncWarehouseBatchActivePropToFilter() {
      const active = state.activeWarehouseConfig;
      const props = getWarehouseBatchFilteredProps();
      if (!props.length || props.some(prop => prop.propName === active.activePropName)) return false;
      active.activePropName = props[0].propName;
      resetWarehouseBatchFields();
      return true;
    }

    function renderWarehouseBatchPropList() {
      const active = state.activeWarehouseConfig;
      const props = getWarehouseBatchFilteredProps();
      if (!props.length) return `<div class="batch-prop-empty">未找到匹配的道具</div>`;
      return props.map(item => {
        const changed = warehouseBatchPropChanged(active.activePropType, item);
        return `<button class="batch-prop-item ${item.propName === active.activePropName ? "active" : ""}" data-batch-prop="${escapeAttr(item.propName)}" type="button">
          <span class="batch-prop-item-name"><span>${escapeHtml(item.propName)}</span>${propPurchaseTypeTag(item)}</span>
          <span class="batch-prop-item-status"><span>${escapeHtml(item.specCode || "暂无规格编号")} · ${warehouseBatchPropStatus(active.activePropType, item)}</span>${changed ? `<span class="changed">已修改</span>` : ""}</span>
        </button>`;
      }).join("");
    }

    function getWarehouseBatchStoreSearchResults() {
      const active = state.activeWarehouseConfig;
      const keyword = String(active.storeKeyword || "").trim().toLowerCase();
      return getWarehouseBatchAvailableStoreIds()
        .map(storeId => stores.find(store => store.id === storeId))
        .filter(store => store && (!keyword || store.storeName.toLowerCase().includes(keyword)));
    }

    function renderWarehouseBatchStoreFilterOptions() {
      const active = state.activeWarehouseConfig;
      const matchedStores = getWarehouseBatchStoreSearchResults();
      const filterIds = new Set(active.storeFilterIdsByType[active.activePropType] || []);
      const allMatched = matchedStores.length > 0 && matchedStores.every(store => filterIds.has(store.id));
      return `${matchedStores.length ? `<label class="batch-store-filter-option all">
        <input type="checkbox" data-batch-store-filter-all ${allMatched ? "checked" : ""}>
        <span>全选当前结果</span>
      </label>` : ""}
      ${matchedStores.map(store => `<label class="batch-store-filter-option">
        <input type="checkbox" data-batch-store-filter-item="${store.id}" ${filterIds.has(store.id) ? "checked" : ""}>
        <span>${escapeHtml(store.storeName)}</span>
      </label>`).join("") || `<div class="batch-store-filter-empty">未找到匹配门店</div>`}`;
    }

    function syncWarehouseBatchStoreFilterAllState(root = els.purchaseModal) {
      const active = state.activeWarehouseConfig;
      const checkbox = root.querySelector("[data-batch-store-filter-all]");
      if (!active || !checkbox) return;
      const matchedStores = getWarehouseBatchStoreSearchResults();
      const filterIds = new Set(active.storeFilterIdsByType[active.activePropType] || []);
      const selectedCount = matchedStores.filter(store => filterIds.has(store.id)).length;
      checkbox.checked = matchedStores.length > 0 && selectedCount === matchedStores.length;
      checkbox.indeterminate = selectedCount > 0 && selectedCount < matchedStores.length;
    }

    function resetWarehouseBatchFields() {
      const active = state.activeWarehouseConfig;
      if (!active || !getActiveWarehouseBatchProp()) return;
      active.batchEnabled = { specDesc: false, qty: false, supplierName: false };
      active.batchValues = { specDesc: "", qty: "", supplierName: "" };
      active.batchNotice = "";
      active.recentBatchCells = [];
      active.lastBatchSnapshot = null;
    }

    function warehouseBatchValueChanged(configKey, storeId, field) {
      const active = state.activeWarehouseConfig;
      const current = active.draftConfigs[configKey]?.[storeId]?.[field];
      const original = active.originalConfigs[configKey]?.[storeId]?.[field];
      return String(current ?? "") !== String(original ?? "");
    }

    function warehouseBatchPropChanged(propType, prop) {
      const active = state.activeWarehouseConfig;
      const configKey = propConfigKey(active.warehouseCode, propType, prop.propName);
      return stores.some(store => ["specDesc", "qty", "supplierName"].some(field => warehouseBatchValueChanged(configKey, store.id, field)));
    }

    function warehouseBatchTypeChanged(group) {
      return (group.specList || []).some(prop => warehouseBatchPropChanged(group.propTypeDesc, prop));
    }

    function warehouseBatchDiffStats() {
      const active = state.activeWarehouseConfig;
      const changedProps = new Set();
      const changedRows = new Set();
      getWarehouseGroups(active.warehouseCode).forEach(group => {
        (group.specList || []).forEach(prop => {
          const configKey = propConfigKey(active.warehouseCode, group.propTypeDesc, prop.propName);
          stores.forEach(store => {
            if (["specDesc", "qty", "supplierName"].some(field => warehouseBatchValueChanged(configKey, store.id, field))) {
              changedProps.add(configKey);
              changedRows.add(`${configKey}__${store.id}`);
            }
          });
        });
      });
      return { propCount: changedProps.size, rowCount: changedRows.size };
    }

    function updateWarehouseBatchDirtyState() {
      const active = state.activeWarehouseConfig;
      const stats = warehouseBatchDiffStats();
      active.dirty = stats.rowCount > 0;
      return stats;
    }

    function warehouseBatchPurchasedQty(propType, prop) {
      const active = state.activeWarehouseConfig;
      const configKey = propConfigKey(active.warehouseCode, propType, prop.propName);
      return getWarehouseBatchAvailableStoreIds(propType).reduce((sum, storeId) => {
        return sum + Number(active.draftConfigs[configKey]?.[storeId]?.qty || 0);
      }, 0);
    }

    function warehouseBatchPropStatus(propType, prop) {
      const qty = warehouseBatchPurchasedQty(propType, prop);
      const type = getPropPurchaseType(prop);
      if (qty > 0) return `采购${qty}${prop.unit || "个"}`;
      if (type === "nonStandard") return "未配置";
      if (type === "optional") return "未采购";
      return "采购数量为0";
    }

    function warehouseBatchFieldPlaceholder(field) {
      if (field === "specDesc") return "请输入规格说明";
      if (field === "qty") return "请输入数量";
      return "请选择供应商";
    }

    function renderWarehouseBatchField(field, label, content) {
      const active = state.activeWarehouseConfig;
      return `<div class="batch-field">
        <label class="batch-field-label">
          <input type="checkbox" data-batch-enable="${field}" ${active.batchEnabled[field] ? "checked" : ""}>
          <span>${label}</span>
        </label>
        ${content}
      </div>`;
    }

    function renderWarehouseConfigModal() {
      const active = state.activeWarehouseConfig;
      const { warehouseCode } = active;
      const position = warehouses.find(item => item.warehouseCode === warehouseCode);
      const groups = getWarehouseGroups(warehouseCode);
      const activeGroup = getActiveWarehouseBatchGroup();
      const prop = getActiveWarehouseBatchProp();
      if (!activeGroup || !prop) return;
      const configKey = getWarehouseBatchConfigKey(prop);
      const availableStoreIds = getWarehouseBatchAvailableStoreIds();
      const visibleStoreIds = getWarehouseBatchVisibleStoreIds();
      const selectedStoreIds = getWarehouseBatchSelectedStoreIds();
      const allSelected = visibleStoreIds.length > 0 && visibleStoreIds.every(storeId => selectedStoreIds.includes(storeId));
      const selectedSet = new Set(selectedStoreIds);
      const storeFilterIds = active.storeFilterIdsByType[active.activePropType] || [];
      const allStoresVisible = availableStoreIds.length === storeFilterIds.length && availableStoreIds.every(storeId => storeFilterIds.includes(storeId));
      const storeFilterLabel = allStoresVisible ? `全部门店（${availableStoreIds.length}）` : `已筛选 ${visibleStoreIds.length}/${availableStoreIds.length}`;
      const suppliers = getAllSuppliers();
      const specEditable = canEditPropSpec(prop);
      const specReadonlyMeta = propSpecReadonlyMeta(prop);
      const stats = updateWarehouseBatchDirtyState();
      const anyBatchFieldEnabled = Object.values(active.batchEnabled).some(Boolean);
      const batchSelectionMode = anyBatchFieldEnabled;
      const batchFieldNames = Object.entries(active.batchEnabled)
        .filter(([, enabled]) => enabled)
        .map(([field]) => ({ specDesc: "规格说明", qty: "数量", supplierName: "供应商" })[field]);

      const typeTabs = groups.map(group => `<button class="batch-type-tab ${group.propTypeDesc === active.activePropType ? "active" : ""}" data-batch-type="${escapeAttr(group.propTypeDesc)}" type="button">
        ${escapeHtml(group.propTypeDesc)}<span class="batch-type-tab-count">${group.specList?.length || 0}</span>
        ${warehouseBatchTypeChanged(group) ? `<span class="batch-type-tab-dirty" title="存在未保存修改"></span>` : ""}
      </button>`).join("");

      const propList = renderWarehouseBatchPropList();

      const specField = specEditable
        ? renderWarehouseBatchField("specDesc", "规格说明", `<div class="batch-field-control"><input data-batch-value="specDesc" value="${escapeAttr(active.batchValues.specDesc)}" placeholder="${escapeAttr(warehouseBatchFieldPlaceholder("specDesc"))}" ${active.batchEnabled.specDesc ? "" : "disabled"}></div>`)
        : `<div class="batch-field"><div class="batch-field-label">规格说明</div><div class="batch-field-readonly" title="${escapeAttr(specReadonlyMeta.title)}">${escapeHtml(specReadonlyMeta.text)}</div></div>`;
      const qtyStep = "0.01";
      const qtyField = renderWarehouseBatchField("qty", "数量", `<div class="batch-field-control"><input data-batch-value="qty" type="number" min="0" step="${qtyStep}" inputmode="decimal" value="${escapeAttr(active.batchValues.qty)}" placeholder="${escapeAttr(warehouseBatchFieldPlaceholder("qty"))}" ${active.batchEnabled.qty ? "" : "disabled"}><span>${escapeHtml(prop.unit || "个")}</span></div>`);
      const supplierField = renderWarehouseBatchField("supplierName", "供应商", `<div class="batch-field-control"><select data-batch-value="supplierName" ${active.batchEnabled.supplierName ? "" : "disabled"}><option value="">请选择供应商</option>${suppliers.map(supplier => `<option value="${escapeAttr(supplier)}" ${supplier === active.batchValues.supplierName ? "selected" : ""}>${escapeHtml(supplier)}</option>`).join("")}</select></div>`);

      const storeRows = visibleStoreIds.map(storeId => {
        const store = stores.find(item => item.id === storeId);
        const config = active.draftConfigs[configKey]?.[storeId] || {};
        return `<tr>
          <td class="store-checkbox-cell"><input type="checkbox" data-batch-store="${storeId}" ${selectedSet.has(storeId) ? "checked" : ""} aria-label="选择${escapeAttr(store?.storeName)}"></td>
          <td class="text-ellipsis" title="${escapeAttr(store?.storeName)}">${escapeHtml(store?.storeName || "-")}</td>
          <td class="${warehouseBatchValueChanged(configKey, storeId, "specDesc") ? "is-modified" : ""}">${specEditable ? `<input data-batch-row-field="specDesc" data-config-key="${escapeAttr(configKey)}" data-store-id="${storeId}" value="${escapeAttr(config.specDesc)}">` : `<span class="spec-readonly-text">${escapeHtml(config.specDesc || prop.specDesc || "-")}</span>`}</td>
          <td class="${warehouseBatchValueChanged(configKey, storeId, "qty") ? "is-modified" : ""}"><div class="batch-row-qty"><input data-batch-row-field="qty" data-config-key="${escapeAttr(configKey)}" data-store-id="${storeId}" type="number" min="0" step="${qtyStep}" inputmode="decimal" value="${escapeAttr(config.qty)}"><span>${escapeHtml(prop.unit || "个")}</span></div></td>
          <td class="${warehouseBatchValueChanged(configKey, storeId, "supplierName") ? "is-modified" : ""}"><select data-batch-row-field="supplierName" data-config-key="${escapeAttr(configKey)}" data-store-id="${storeId}">${getAllSuppliers(prop.supplierName).map(supplier => `<option value="${escapeAttr(supplier)}" ${supplier === config.supplierName ? "selected" : ""}>${escapeHtml(supplier)}</option>`).join("")}</select></td>
        </tr>`;
      }).join("");

      els.purchaseModal.classList.add("open");
      els.purchaseModal.innerHTML = `<div class="purchase-modal batch-purchase-modal" data-warehouse-batch-modal>
        <div class="modal-header">
          <div class="batch-modal-title"><span>${escapeHtml(position?.warehouseName || "仓位")} - 批量采购配置</span><small>已选 ${new Set(groups.flatMap(group => state.selections[groupKey(warehouseCode, group.propTypeDesc)] || [])).size} 家门店</small></div>
          <button class="modal-close" data-modal-close type="button">×</button>
        </div>
        <div class="modal-body">
          <div class="batch-type-tabs" role="tablist" aria-label="道具类型">${typeTabs}</div>
          <div class="batch-editor">
            <aside class="batch-prop-nav">
              <div class="batch-prop-nav-title">${escapeHtml(active.activePropType)}下的道具</div>
              <div class="batch-prop-toolbar">
                <input class="batch-prop-search" data-batch-prop-keyword placeholder="搜索规格编号/道具名称" value="${escapeAttr(active.propKeyword)}" aria-label="搜索规格编号或道具名称">
                <select class="batch-prop-filter" data-batch-prop-type-filter aria-label="筛选道具类型">
                  <option value="" ${active.propPurchaseTypeFilter ? "" : "selected"}>全部类型</option>
                  <option value="standard" ${active.propPurchaseTypeFilter === "standard" ? "selected" : ""}>标准</option>
                  <option value="nonStandard" ${active.propPurchaseTypeFilter === "nonStandard" ? "selected" : ""}>非标</option>
                  <option value="optional" ${active.propPurchaseTypeFilter === "optional" ? "selected" : ""}>可选</option>
                </select>
              </div>
              <div class="batch-prop-list" data-batch-prop-list>${propList}</div>
            </aside>
            <section class="batch-config-pane">
              <div class="batch-active-prop"><span>${escapeHtml(prop.propName)}</span>${propPurchaseTypeTag(prop)}</div>
              <div class="batch-field-panel">
                <div class="batch-field-panel-head"><span class="batch-field-panel-title">批量设置</span><span class="batch-target-summary">已选择 ${selectedStoreIds.length}/${visibleStoreIds.length} 家门店</span></div>
                <div class="batch-fields">
                  ${specField}${qtyField}${supplierField}
                  <button class="btn btn-primary batch-apply-button" data-batch-apply type="button" ${selectedStoreIds.length && anyBatchFieldEnabled ? "" : "disabled"}>应用到${selectedStoreIds.length}家门店</button>
                </div>
              </div>
              ${active.batchNotice ? `<div class="batch-apply-notice"><span>${escapeHtml(active.batchNotice)}</span><button class="btn btn-link" data-batch-undo type="button">撤销本次应用</button></div>` : ""}
              <div class="batch-store-section">
                <div class="batch-store-head">
                  <div class="batch-store-head-main">
                    <strong>采购门店</strong>
                    ${availableStoreIds.length ? `<div class="batch-store-filter" data-batch-store-filter>
                      <button class="batch-store-filter-trigger ${active.storeFilterOpen ? "open" : ""}" data-batch-store-filter-trigger type="button" aria-expanded="${active.storeFilterOpen}"><span>${storeFilterLabel}</span><span>⌄</span></button>
                      <div class="batch-store-filter-panel ${active.storeFilterOpen ? "open" : ""}" data-batch-store-filter-panel>
                        <input class="batch-store-filter-search" data-batch-store-keyword placeholder="搜索门店名称" value="${escapeAttr(active.storeKeyword)}" aria-label="搜索门店名称">
                        <div class="batch-store-filter-options" data-batch-store-filter-options>${renderWarehouseBatchStoreFilterOptions()}</div>
                      </div>
                    </div>` : ""}
                  </div>
                  <span>${availableStoreIds.length ? `批量字段仅覆盖当前列表中勾选门店，仍可逐行调整` : `请先在页面中选择采购门店`}</span>
                </div>
                ${availableStoreIds.length === 0 ? `<div class="batch-empty-stores">当前道具类型尚未选择采购门店</div>` : visibleStoreIds.length ? `<div class="batch-store-table-wrap"><table class="batch-store-table"><thead><tr><th style="width:42px;text-align:center"><input type="checkbox" data-batch-store-all ${allSelected ? "checked" : ""} aria-label="全选当前筛选门店"></th><th style="width:180px">门店</th><th>规格说明</th><th style="width:132px">数量</th><th style="width:190px">供应商</th></tr></thead><tbody>${storeRows}</tbody></table></div>` : `<div class="batch-empty-stores">当前筛选条件下暂无采购门店</div>`}
              </div>
            </section>
          </div>
        </div>
        <div class="modal-footer">
          <span class="batch-footer-summary" data-batch-footer-summary>${stats.rowCount ? `已修改 ${stats.propCount} 个道具、${stats.rowCount} 条门店配置` : "暂未修改配置"}</span>
          <button class="btn" data-batch-cancel type="button">取消</button>
          <button class="btn btn-primary" data-batch-save type="button" ${stats.rowCount ? "" : "disabled"}>保存全部配置</button>
        </div>
      </div>`;
      const selectAllStores = els.purchaseModal.querySelector("[data-batch-store-all]");
      if (selectAllStores) selectAllStores.indeterminate = selectedStoreIds.length > 0 && !allSelected;
      syncWarehouseBatchStoreFilterAllState();
    }

    function activateWarehouseBatchType(propType) {
      const active = state.activeWarehouseConfig;
      const group = getWarehouseGroups(active.warehouseCode).find(item => item.propTypeDesc === propType);
      if (!group) return;
      active.activePropType = propType;
      active.activePropName = group.specList?.[0]?.propName || "";
      if (!active.selectedStoreIdsByType[propType]) {
        active.selectedStoreIdsByType[propType] = getWarehouseBatchAvailableStoreIds(propType);
      }
      if (!active.storeFilterIdsByType[propType]) {
        active.storeFilterIdsByType[propType] = getWarehouseBatchAvailableStoreIds(propType);
      }
      active.storeFilterOpen = false;
      active.storeKeyword = "";
      resetWarehouseBatchFields();
      renderWarehouseConfigSurface();
    }

    function activateWarehouseBatchProp(propName) {
      const active = state.activeWarehouseConfig;
      if (!getActiveWarehouseBatchGroup()?.specList?.some(prop => prop.propName === propName)) return;
      active.activePropName = propName;
      resetWarehouseBatchFields();
      renderWarehouseConfigSurface();
    }

    function validateWarehouseBatchQty(value) {
      return validatePurchaseQty(value);
    }

    function applyWarehouseBatchValues() {
      const active = state.activeWarehouseConfig;
      const prop = getActiveWarehouseBatchProp();
      const storeIds = getWarehouseBatchSelectedStoreIds();
      const enabledFields = Object.entries(active.batchEnabled).filter(([, enabled]) => enabled).map(([field]) => field);
      if (!storeIds.length) return showToast(active.mode === "inline" ? "请至少选择一家批量设置的应用门店" : "请至少选择一家采购门店");
      if (!enabledFields.length) return showToast("请勾选需要批量设置的字段");
      if (active.batchEnabled.specDesc && !String(active.batchValues.specDesc || "").trim()) return showToast("请输入规格说明");
      if (active.batchEnabled.qty) {
        const qtyError = validateWarehouseBatchQty(active.batchValues.qty, prop);
        if (qtyError) return showToast(qtyError);
      }
      if (active.batchEnabled.supplierName && !active.batchValues.supplierName) return showToast("请选择供应商");

      const configKey = getWarehouseBatchConfigKey(prop);
      active.lastBatchSnapshot = cloneData(active.draftConfigs);
      active.recentBatchCells = [];
      storeIds.forEach(storeId => {
        enabledFields.forEach(field => {
          active.draftConfigs[configKey][storeId][field] = field === "qty"
            ? Number(active.batchValues[field])
            : active.batchValues[field];
          active.recentBatchCells.push(`${configKey}__${storeId}__${field}`);
        });
      });
      const fieldNames = enabledFields.map(field => ({ specDesc: "规格说明", qty: "数量", supplierName: "供应商" })[field]);
      active.batchNotice = active.mode === "inline"
        ? `已将“${fieldNames.join("、")}”应用到${storeIds.length}家门店`
        : `已将“${fieldNames.join("、")}”应用到${storeIds.length}家门店，尚未保存`;
      if (active.mode === "inline") {
        active.batchEnabled = { specDesc: false, qty: false, supplierName: false };
        active.batchValues = { specDesc: "", qty: "", supplierName: "" };
        active.selectedStoreIdsByType[active.activePropType] = [];
      }
      updateWarehouseBatchDirtyState();
      persistInlineWarehouseConfig();
      renderWarehouseConfigSurface();
    }

    function undoWarehouseBatchApply() {
      const active = state.activeWarehouseConfig;
      if (!active.lastBatchSnapshot) return;
      active.draftConfigs = cloneData(active.lastBatchSnapshot);
      active.lastBatchSnapshot = null;
      active.recentBatchCells = [];
      active.batchNotice = "";
      updateWarehouseBatchDirtyState();
      resetWarehouseBatchFields();
      persistInlineWarehouseConfig();
      renderWarehouseConfigSurface();
      showToast("已撤销本次批量应用");
    }

    function updateWarehouseBatchRowField(field) {
      const active = state.activeWarehouseConfig;
      const configKey = field.dataset.configKey;
      const storeId = field.dataset.storeId;
      const fieldName = field.dataset.batchRowField;
      if (!active?.draftConfigs[configKey]?.[storeId] || !fieldName) return;
      active.draftConfigs[configKey][storeId][fieldName] = fieldName === "qty" ? Number(field.value || 0) : field.value;
      field.closest("td")?.classList.toggle("is-modified", warehouseBatchValueChanged(configKey, storeId, fieldName));
      persistInlineWarehouseConfig();
      syncWarehouseBatchFooter();
    }

    function syncWarehouseBatchFooter() {
      if (!state.activeWarehouseConfig) return;
      const stats = updateWarehouseBatchDirtyState();
      const root = state.activeWarehouseConfig.mode === "inline" ? els.detailPanel : els.purchaseModal;
      const summary = root.querySelector("[data-batch-footer-summary]");
      const saveButton = root.querySelector("[data-batch-save]");
      if (summary) {
        summary.textContent = stats.rowCount
          ? `${state.activeWarehouseConfig.mode === "inline" ? "已调整" : "已修改"} ${stats.propCount} 个道具、${stats.rowCount} 条门店配置`
          : state.activeWarehouseConfig.mode === "inline" ? "" : "暂未修改配置";
      }
      if (saveButton) saveButton.disabled = stats.rowCount === 0;
    }

    function validateWarehouseBatchDraft() {
      const active = state.activeWarehouseConfig;
      const groups = getWarehouseGroups(active.warehouseCode);
      for (const group of groups) {
        const storeIds = getWarehouseBatchAvailableStoreIds(group.propTypeDesc);
        for (const prop of (group.specList || [])) {
          const configKey = propConfigKey(active.warehouseCode, group.propTypeDesc, prop.propName);
          for (const storeId of storeIds) {
            const config = active.draftConfigs[configKey]?.[storeId] || {};
            const store = stores.find(item => item.id === storeId);
            const qtyError = validateWarehouseBatchQty(config.qty, prop);
            if (qtyError) return { group, prop, message: `${store?.storeName || "门店"}：${qtyError}` };
            if (Number(config.qty) > 0 && canEditPropSpec(prop) && !String(config.specDesc || "").trim()) {
              return { group, prop, message: `${store?.storeName || "门店"}：规格说明不能为空` };
            }
            if (Number(config.qty) > 0 && !config.supplierName) {
              return { group, prop, message: `${store?.storeName || "门店"}：请选择供应商` };
            }
          }
        }
      }
      return null;
    }

    function saveWarehouseBatchConfig() {
      const active = state.activeWarehouseConfig;
      const error = validateWarehouseBatchDraft();
      if (error) {
        active.activePropType = error.group.propTypeDesc;
        active.activePropName = error.prop.propName;
        resetWarehouseBatchFields();
        renderWarehouseConfigSurface();
        showToast(error.message);
        return;
      }
      Object.entries(active.draftConfigs).forEach(([configKey, configs]) => {
        state.storePropConfigs[configKey] = cloneData(configs);
      });
      active.dirty = false;
      closePurchaseModal();
      render();
      showToast("批量采购配置已保存");
    }

    function requestCloseWarehouseBatch() {
      const active = state.activeWarehouseConfig;
      if (active?.dirty && !window.confirm("当前存在未保存的批量配置，确定放弃修改吗？")) return;
      closePurchaseModal();
    }

    function renderWarehouseInlinePropCards() {
      const active = state.activeWarehouseConfig;
      const props = getWarehouseBatchFilteredProps();
      if (!props.length) return `<div class="batch-prop-empty">未找到匹配的道具</div>`;
      return props.map(item => `<button class="inline-prop-card ${item.propName === active.activePropName ? "active" : ""}" data-inline-batch-prop="${escapeAttr(item.propName)}" type="button" aria-pressed="${item.propName === active.activePropName}">
        <span class="prop-image">${propIcon(active.activePropType)}</span>
        <span class="inline-prop-card-body">
          <span class="inline-prop-card-name"><span>${escapeHtml(item.propName)}</span>${propPurchaseTypeTag(item)}</span>
          <span class="inline-prop-card-price">${escapeHtml(formatUnitPrice(item))}</span>
          <span class="inline-prop-card-code">${escapeHtml(item.specCode || "暂无规格编号")}${warehouseBatchPropChanged(active.activePropType, item) ? " · 已调整" : ""}</span>
        </span>
      </button>`).join("");
    }

    function renderWarehouseInlineConfig(position, groups) {
      const active = ensureInlineWarehouseConfig(position.warehouseCode);
      const activeGroup = getActiveWarehouseBatchGroup();
      const prop = getActiveWarehouseBatchProp();
      if (!active || !activeGroup || !prop) return `<div class="empty-data-tip">暂无道具数据</div>`;

      const selectionKey = groupKey(position.warehouseCode, active.activePropType);
      const availableStoreIds = getWarehouseBatchAvailableStoreIds();
      const visibleStoreIds = getWarehouseBatchVisibleStoreIds();
      const selectedStoreIds = getWarehouseBatchSelectedStoreIds();
      const selectedSet = new Set(selectedStoreIds);
      const allPurchaseStoresSelected = stores.length > 0 && stores.every(store => availableStoreIds.includes(store.id));
      const purchaseStoresIndeterminate = availableStoreIds.length > 0 && !allPurchaseStoresSelected;
      const allBatchStoresSelected = visibleStoreIds.length > 0 && visibleStoreIds.every(storeId => selectedSet.has(storeId));
      const configKey = getWarehouseBatchConfigKey(prop);
      const suppliers = getAllSuppliers();
      const specEditable = canEditPropSpec(prop);
      const specReadonlyMeta = propSpecReadonlyMeta(prop);
      const stats = updateWarehouseBatchDirtyState();
      const anyBatchFieldEnabled = Object.values(active.batchEnabled).some(Boolean);
      const batchSelectionMode = anyBatchFieldEnabled;
      const storeFilterIds = active.storeFilterIdsByType[active.activePropType] || [];
      const allStoresVisible = availableStoreIds.length === storeFilterIds.length && availableStoreIds.every(storeId => storeFilterIds.includes(storeId));
      const storeFilterLabel = allStoresVisible ? `全部门店（${availableStoreIds.length}）` : `已筛选 ${visibleStoreIds.length}/${availableStoreIds.length}`;

      const typeTabs = groups.map(group => `<button class="batch-type-tab ${group.propTypeDesc === active.activePropType ? "active" : ""}" data-inline-batch-type="${escapeAttr(group.propTypeDesc)}" type="button" role="tab" aria-selected="${group.propTypeDesc === active.activePropType}">
        ${escapeHtml(group.propTypeDesc)}<span class="batch-type-tab-count">${group.specList?.length || 0}</span>
        ${warehouseBatchTypeChanged(group) ? `<span class="batch-type-tab-dirty" title="已调整配置"></span>` : ""}
      </button>`).join("");

      const propCards = renderWarehouseInlinePropCards();

      const specField = specEditable
        ? renderWarehouseBatchField("specDesc", "规格说明", `<div class="batch-field-control"><input data-batch-value="specDesc" value="${escapeAttr(active.batchValues.specDesc)}" placeholder="请输入规格说明" ${active.batchEnabled.specDesc ? "" : "disabled"}></div>`)
        : `<div class="batch-field"><div class="batch-field-label">规格说明</div><div class="batch-field-readonly" title="${escapeAttr(specReadonlyMeta.title)}">${escapeHtml(specReadonlyMeta.text)}</div></div>`;
      const qtyField = renderWarehouseBatchField("qty", "数量", `<div class="batch-field-control"><input data-batch-value="qty" type="number" min="0" step="0.01" inputmode="decimal" value="${escapeAttr(active.batchValues.qty)}" placeholder="请输入数量" ${active.batchEnabled.qty ? "" : "disabled"}><span>${escapeHtml(prop.unit || "个")}</span></div>`);
      const supplierField = renderWarehouseBatchField("supplierName", "供应商", `<div class="batch-field-control"><select data-batch-value="supplierName" ${active.batchEnabled.supplierName ? "" : "disabled"}><option value="">请选择供应商</option>${suppliers.map(supplier => `<option value="${escapeAttr(supplier)}" ${supplier === active.batchValues.supplierName ? "selected" : ""}>${escapeHtml(supplier)}</option>`).join("")}</select></div>`);

      const storeRows = visibleStoreIds.map(storeId => {
        const store = stores.find(item => item.id === storeId);
        const config = active.draftConfigs[configKey]?.[storeId] || {};
        return `<tr class="${batchSelectionMode && selectedSet.has(storeId) ? "inline-batch-target-row" : ""}">
          ${batchSelectionMode ? `<td class="store-checkbox-cell"><input type="checkbox" data-inline-batch-store="${storeId}" ${selectedSet.has(storeId) ? "checked" : ""} aria-label="将${escapeAttr(store?.storeName)}纳入本次批量设置"></td>` : ""}
          <td class="text-ellipsis" title="${escapeAttr(store?.storeName)}">${escapeHtml(store?.storeName || "-")}</td>
          <td class="${warehouseBatchValueChanged(configKey, storeId, "specDesc") ? "is-modified" : ""}">${specEditable ? `<input data-batch-row-field="specDesc" data-config-key="${escapeAttr(configKey)}" data-store-id="${storeId}" value="${escapeAttr(config.specDesc)}">` : `<span class="spec-readonly-text">${escapeHtml(config.specDesc || prop.specDesc || "-")}</span>`}</td>
          <td class="${warehouseBatchValueChanged(configKey, storeId, "qty") ? "is-modified" : ""}"><div class="batch-row-qty"><input data-batch-row-field="qty" data-config-key="${escapeAttr(configKey)}" data-store-id="${storeId}" type="number" min="0" step="0.01" inputmode="decimal" value="${escapeAttr(config.qty)}"><span>${escapeHtml(prop.unit || "个")}</span></div></td>
          <td class="${warehouseBatchValueChanged(configKey, storeId, "supplierName") ? "is-modified" : ""}"><select data-batch-row-field="supplierName" data-config-key="${escapeAttr(configKey)}" data-store-id="${storeId}">${getAllSuppliers(prop.supplierName).map(supplier => `<option value="${escapeAttr(supplier)}" ${supplier === config.supplierName ? "selected" : ""}>${escapeHtml(supplier)}</option>`).join("")}</select></td>
        </tr>`;
      }).join("");

      return `<section class="inline-purchase-workspace" data-inline-purchase-workspace>
        <div class="batch-type-tabs inline-type-tabs" role="tablist" aria-label="道具类型">${typeTabs}</div>
        <div class="inline-store-selector ${active.storeSelectorExpanded ? "" : "collapsed"}" data-inline-store-selector>
          <div class="inline-store-selector-head">
            <button class="inline-section-toggle" data-toggle-inline-stores type="button" aria-expanded="${active.storeSelectorExpanded}">
              <span class="inline-store-selector-title"><span>采购门店</span><small>${escapeHtml(active.activePropType)}已选 ${availableStoreIds.length}/${stores.length} 家</small></span>
              <span class="inline-collapse-action">${active.storeSelectorExpanded ? "收起" : "展开"}<span class="inline-collapse-icon ${active.storeSelectorExpanded ? "expanded" : ""}">⌄</span></span>
            </button>
            <label class="inline-store-option"><input type="checkbox" data-select-all="${selectionKey}" ${allPurchaseStoresSelected ? "checked" : ""} ${purchaseStoresIndeterminate ? "data-indeterminate='true'" : ""}>全选所有门店</label>
          </div>
          ${active.storeSelectorExpanded ? `<div class="inline-store-options">
            ${stores.map(store => {
              const checked = availableStoreIds.includes(store.id);
              const qtyKey = storeGroupQtyKey(selectionKey, store.id);
              return `<label class="inline-store-option">
                <input type="checkbox" data-store-check="${selectionKey}" value="${store.id}" ${checked ? "checked" : ""}>
                <span class="inline-store-name">${escapeHtml(store.storeName)}</span>
                ${checked ? `<span class="inline-store-warehouse-qty">采购仓位数<input data-store-purchase-qty="${qtyKey}" type="number" min="1" step="1" inputmode="numeric" value="${state.storeGroupPurchaseQty[qtyKey] ?? 1}" aria-label="${escapeAttr(store.storeName)}采购仓位数量" onclick="event.stopPropagation()">个</span>` : ""}
              </label>`;
            }).join("")}

    els.positionList.addEventListener("click", event => {
      const item = event.target.closest("[data-code]");
      if (!item) return;

      render();

    function areaTooltip() {
      let tooltip = document.getElementById("areaTooltipFloating");
      if (!tooltip) {
        tooltip = document.createElement("div");
        tooltip.id = "areaTooltipFloating";
        tooltip.className = "area-tooltip-floating";
        document.body.appendChild(tooltip);
      }
      return tooltip;
    }

    function moveAreaTooltip(event) {
      const tooltip = areaTooltip();
      const gap = 12;
      let left = event.clientX + gap;
      let top = event.clientY + gap;
      const rect = tooltip.getBoundingClientRect();
      if (left + rect.width > window.innerWidth - gap) {
        left = Math.max(gap, window.innerWidth - rect.width - gap);
      }
      if (top + rect.height > window.innerHeight - gap) {
        top = Math.max(gap, event.clientY - rect.height - gap);
      }
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    els.positionList.addEventListener("mouseover", event => {
      const target = event.target.closest(".pos-area-tag[data-area-tooltip]");
      if (!target || !els.positionList.contains(target)) return;
      const tooltip = areaTooltip();
      tooltip.textContent = target.dataset.areaTooltip || "-";
      tooltip.style.display = "block";
      moveAreaTooltip(event);
    });

    els.positionList.addEventListener("mousemove", event => {
      if (document.getElementById("areaTooltipFloating")?.style.display === "block") {
        moveAreaTooltip(event);
      }
    });

    els.positionList.addEventListener("mouseout", event => {
      const target = event.target.closest(".pos-area-tag[data-area-tooltip]");
      if (!target || target.contains(event.relatedTarget)) return;
      areaTooltip().style.display = "none";
    });

    els.detailPanel.addEventListener("click", event => {
      if (event.target.closest("[data-toggle-inline-stores]") && state.activeWarehouseConfig?.mode === "inline") {
        state.activeWarehouseConfig.storeSelectorExpanded = !state.activeWarehouseConfig.storeSelectorExpanded;
        render();
        return;
      }

      if (event.target.closest("[data-toggle-inline-batch]") && state.activeWarehouseConfig?.mode === "inline") {
        state.activeWarehouseConfig.batchPanelExpanded = !state.activeWarehouseConfig.batchPanelExpanded;
        render();
        return;
      }

      const inlineStoreFilterTrigger = event.target.closest("[data-inline-store-filter-trigger]");
      if (inlineStoreFilterTrigger && state.activeWarehouseConfig?.mode === "inline") {
        const active = state.activeWarehouseConfig;
        active.storeFilterOpen = !active.storeFilterOpen;
        inlineStoreFilterTrigger.classList.toggle("open", active.storeFilterOpen);
        inlineStoreFilterTrigger.setAttribute("aria-expanded", String(active.storeFilterOpen));
        els.detailPanel.querySelector("[data-inline-store-filter-panel]")?.classList.toggle("open", active.storeFilterOpen);
        if (active.storeFilterOpen) {
          window.setTimeout(() => els.detailPanel.querySelector("[data-inline-store-keyword]")?.focus(), 0);
        }
        return;
      }

      if (state.activeWarehouseConfig?.mode === "inline" && state.activeWarehouseConfig.storeFilterOpen && !event.target.closest("[data-inline-store-filter]")) {
        state.activeWarehouseConfig.storeFilterOpen = false;
        els.detailPanel.querySelector("[data-inline-store-filter-trigger]")?.classList.remove("open");
        els.detailPanel.querySelector("[data-inline-store-filter-trigger]")?.setAttribute("aria-expanded", "false");
        els.detailPanel.querySelector("[data-inline-store-filter-panel]")?.classList.remove("open");
      }

      const inlineBatchType = event.target.closest("[data-inline-batch-type]");
      if (inlineBatchType && state.activeWarehouseConfig?.mode === "inline") {
        activateWarehouseBatchType(inlineBatchType.dataset.inlineBatchType);
        return;
      }

      const inlineBatchProp = event.target.closest("[data-inline-batch-prop]");
      if (inlineBatchProp && state.activeWarehouseConfig?.mode === "inline") {
        activateWarehouseBatchProp(inlineBatchProp.dataset.inlineBatchProp);
        return;
      }

      if (event.target.closest("[data-inline-batch-apply]") && state.activeWarehouseConfig?.mode === "inline") {
        applyWarehouseBatchValues();
        return;
      }

      if (event.target.closest("[data-inline-batch-undo]") && state.activeWarehouseConfig?.mode === "inline") {
        undoWarehouseBatchApply();
        return;
      }

      const warehouseBatchButton = event.target.closest("[data-open-warehouse-batch]");
      if (warehouseBatchButton) {
        openWarehouseConfigModal(warehouseBatchButton.dataset.openWarehouseBatch);
        return;
      }

      const groupToggle = event.target.closest("[data-toggle-group]");
      if (groupToggle) {
        const key = groupToggle.dataset.toggleGroup;
        if (state.expandedGroups.has(key)) {
          state.expandedGroups.delete(key);
        } else {
          const code = key.split("_")[0];
          [...state.expandedGroups].forEach(item => {
            if (item.startsWith(`${code}_`)) state.expandedGroups.delete(item);
          });
          state.expandedGroups.add(key);
        }
        render();
        return;
      }

      const configToggle = event.target.closest("[data-toggle-config]");
      if (configToggle) {
        const key = configToggle.dataset.toggleConfig;
        if (state.expandedConfig.has(key)) state.expandedConfig.delete(key);
        else state.expandedConfig.add(key);
        render();
        return;
      }

      const purchaseBtn = event.target.closest("[data-purchase-prop]");
      if (purchaseBtn) {
        const [warehouseCode, propType, propName] = purchaseBtn.dataset.purchaseProp.split("|");
        openPurchaseModal(warehouseCode, propType, propName);
        return;
      }

      const addNonStandardBtn = event.target.closest("[data-add-non-standard]");
      if (addNonStandardBtn) {
        openNonStandardAddModal();
        return;
      }

      const editNonStandardBtn = event.target.closest("[data-edit-non-standard]");
      if (editNonStandardBtn) {
        openNonStandardAddModal(Number(editNonStandardBtn.dataset.editNonStandard));
        return;
      }

      const deleteNonStandardBtn = event.target.closest("[data-delete-non-standard]");
      if (deleteNonStandardBtn) {
        state.globalNonStandardProps.splice(Number(deleteNonStandardBtn.dataset.deleteNonStandard), 1);
        render();
        showToast("定制道具已删除");
        return;
      }

      if (event.target.closest("#draftSaveBtn")) {
        saveDraft();
        return;
      }

      if (event.target.id === "nextBtn") {
        const missingStores = stores.filter(store => {
          return !Object.values(state.selections).some(ids => ids.includes(store.id));
        });
        if (missingStores.length) {
          showToast(`以下门店未选择仓位道具：${missingStores.map(s => s.storeName).join("、")}`);
          return;
        }
        window.location.href = "createOrderWarehouse.html";
      }
    });

    els.detailPanel.addEventListener("change", event => {
      const allInput = event.target.closest("[data-select-all]");
      if (allInput) {
        const key = allInput.dataset.selectAll;
        state.selections[key] = allInput.checked ? stores.map(store => store.id) : [];
        render();
        return;
      }

      const storeInput = event.target.closest("[data-store-check]");
      if (storeInput) {
        const key = storeInput.dataset.storeCheck;
        const selected = new Set(state.selections[key] || []);
        const qtyKey = storeGroupQtyKey(key, storeInput.value);
        if (storeInput.checked) {
          selected.add(storeInput.value);
          if (state.storeGroupPurchaseQty[qtyKey] == null) {
            state.storeGroupPurchaseQty[qtyKey] = 1;
          }
        } else {
          selected.delete(storeInput.value);
        }
        state.selections[key] = [...selected];
        render();
        return;
      }

      const propTypeFilter = event.target.closest("[data-inline-prop-type-filter]");
      if (propTypeFilter && state.activeWarehouseConfig?.mode === "inline") {
        state.activeWarehouseConfig.propPurchaseTypeFilter = propTypeFilter.value;
        syncWarehouseBatchActivePropToFilter();
        render();
        return;
      }

      const storeFilterAll = event.target.closest("[data-batch-store-filter-all]");
      if (storeFilterAll && state.activeWarehouseConfig?.mode === "inline") {
        const active = state.activeWarehouseConfig;
        const filterIds = new Set(active.storeFilterIdsByType[active.activePropType] || []);
        getWarehouseBatchStoreSearchResults().forEach(store => {
          if (storeFilterAll.checked) filterIds.add(store.id);
          else filterIds.delete(store.id);
        });
        active.storeFilterIdsByType[active.activePropType] = [...filterIds];
        active.storeFilterOpen = true;
        if (Object.values(active.batchEnabled).some(Boolean)) {
          active.selectedStoreIdsByType[active.activePropType] = getWarehouseBatchVisibleStoreIds();
        }
        render();
        return;
      }

      const storeFilterItem = event.target.closest("[data-batch-store-filter-item]");
      if (storeFilterItem && state.activeWarehouseConfig?.mode === "inline") {
        const active = state.activeWarehouseConfig;
        const filterIds = new Set(active.storeFilterIdsByType[active.activePropType] || []);
        if (storeFilterItem.checked) filterIds.add(storeFilterItem.dataset.batchStoreFilterItem);
        else filterIds.delete(storeFilterItem.dataset.batchStoreFilterItem);
        active.storeFilterIdsByType[active.activePropType] = [...filterIds];
        active.storeFilterOpen = true;
        if (Object.values(active.batchEnabled).some(Boolean)) {
          active.selectedStoreIdsByType[active.activePropType] = getWarehouseBatchVisibleStoreIds();
        }
        render();
        return;
      }

      const batchEnable = event.target.closest("[data-batch-enable]");
      if (batchEnable && state.activeWarehouseConfig?.mode === "inline") {
        const active = state.activeWarehouseConfig;
        const wasBatchSelectionMode = Object.values(active.batchEnabled).some(Boolean);
        active.batchEnabled[batchEnable.dataset.batchEnable] = batchEnable.checked;
        active.batchNotice = "";
        const isBatchSelectionMode = Object.values(active.batchEnabled).some(Boolean);
        if (!wasBatchSelectionMode && isBatchSelectionMode) {
          active.selectedStoreIdsByType[active.activePropType] = getWarehouseBatchVisibleStoreIds();
        }
        if (!isBatchSelectionMode) {
          active.selectedStoreIdsByType[active.activePropType] = [];
        }
        const fieldName = batchEnable.dataset.batchEnable;
        render();
        if (batchEnable.checked) {
          els.detailPanel.querySelector(`[data-batch-value="${fieldName}"]`)?.focus();
        }
        return;
      }

      const batchStoreAll = event.target.closest("[data-inline-batch-store-all]");
      if (batchStoreAll && state.activeWarehouseConfig?.mode === "inline") {
        const active = state.activeWarehouseConfig;
        const selected = new Set(active.selectedStoreIdsByType[active.activePropType] || []);
        getWarehouseBatchVisibleStoreIds().forEach(storeId => {
          if (batchStoreAll.checked) selected.add(storeId);
          else selected.delete(storeId);
        });
        active.selectedStoreIdsByType[active.activePropType] = [...selected];
        if (!Object.values(active.batchEnabled).some(Boolean)) resetWarehouseBatchFields();
        render();
        return;
      }

      const batchStore = event.target.closest("[data-inline-batch-store]");
      if (batchStore && state.activeWarehouseConfig?.mode === "inline") {
        const active = state.activeWarehouseConfig;
        const selected = new Set(active.selectedStoreIdsByType[active.activePropType] || []);
        if (batchStore.checked) selected.add(batchStore.dataset.inlineBatchStore);
        else selected.delete(batchStore.dataset.inlineBatchStore);
        active.selectedStoreIdsByType[active.activePropType] = [...selected];
        render();
        return;
      }

      const batchValue = event.target.closest("[data-batch-value]");
      if (batchValue && state.activeWarehouseConfig?.mode === "inline") {
        state.activeWarehouseConfig.batchValues[batchValue.dataset.batchValue] = batchValue.value;
        return;
      }

      const batchRowField = event.target.closest("[data-batch-row-field]");
      if (batchRowField && state.activeWarehouseConfig?.mode === "inline") {
        updateWarehouseBatchRowField(batchRowField);
      }

        storeFilterTrigger.setAttribute("aria-expanded", String(active.storeFilterOpen));
        els.purchaseModal.querySelector("[data-batch-store-filter-panel]")?.classList.toggle("open", active.storeFilterOpen);

          window.setTimeout(() => els.purchaseModal.querySelector("[data-batch-store-keyword]")?.focus(), 0);

        return;

      if (state.activeWarehouseConfig?.storeFilterOpen && !event.target.closest("[data-batch-store-filter]")) {

        els.purchaseModal.querySelector("[data-batch-store-filter-trigger]")?.classList.remove("open");

        els.purchaseModal.querySelector("[data-batch-store-filter-panel]")?.classList.remove("open");
      }

      const batchTypeTab = event.target.closest("[data-batch-type]");
      if (batchTypeTab && state.activeWarehouseConfig) {
        activateWarehouseBatchType(batchTypeTab.dataset.batchType);
        return;
      }

      const batchPropButton = event.target.closest("[data-batch-prop]");
      if (batchPropButton && state.activeWarehouseConfig) {
        activateWarehouseBatchProp(batchPropButton.dataset.batchProp);
        return;
      }

      if (event.target.closest("[data-batch-apply]") && state.activeWarehouseConfig) {
        applyWarehouseBatchValues();
        return;
      }

      if (event.target.closest("[data-batch-undo]") && state.activeWarehouseConfig) {
        undoWarehouseBatchApply();
        return;
      }

      if (event.target.closest("[data-batch-save]") && state.activeWarehouseConfig) {
        saveWarehouseBatchConfig();
        return;
      }

      if (event.target.closest("[data-batch-cancel]") && state.activeWarehouseConfig) {
        requestCloseWarehouseBatch();
        return;
      }

      if (event.target.closest("[data-store-select-trigger]") && state.activeNonStandardAdd) {
        state.activeNonStandardAdd.storePanelOpen = !state.activeNonStandardAdd.storePanelOpen;
        const panel = els.purchaseModal.querySelector("[data-store-select-panel]");
        const trigger = els.purchaseModal.querySelector("[data-store-select-trigger]");
        panel?.classList.toggle("open", state.activeNonStandardAdd.storePanelOpen);
        trigger?.classList.toggle("open", state.activeNonStandardAdd.storePanelOpen);
        return;
      }

      if (!event.target.closest("[data-store-multi-select]") && state.activeNonStandardAdd?.storePanelOpen) {
        state.activeNonStandardAdd.storePanelOpen = false;
        els.purchaseModal.querySelector("[data-store-select-panel]")?.classList.remove("open");
        els.purchaseModal.querySelector("[data-store-select-trigger]")?.classList.remove("open");
      }

      if (event.target.closest("[data-modal-save]")) {
        savePurchaseConfig();
        return;
      }

      const restoreDraftBtn = event.target.closest("[data-restore-draft]");
      if (restoreDraftBtn) {
        restoreDraft(restoreDraftBtn.dataset.restoreDraft);
        return;
      }

      const deleteDraftBtn = event.target.closest("[data-delete-draft]");
      if (deleteDraftBtn) {
        deleteDraft(deleteDraftBtn.dataset.deleteDraft);
        return;
      }

      if (event.target.closest("[data-save-non-standard]")) {
        saveNonStandardProp();
        return;
      }

      const uploadTrigger = event.target.closest("[data-upload-trigger]");
      if (uploadTrigger && state.activeNonStandardAdd) {
        els.purchaseModal.querySelector('[data-non-standard-field="imageName"]')?.click();
      }

    });

    els.purchaseModal.addEventListener("input", event => {
      const propKeyword = event.target.closest("[data-batch-prop-keyword]");
      if (propKeyword && state.activeWarehouseConfig) {
        state.activeWarehouseConfig.propKeyword = propKeyword.value;
        if (syncWarehouseBatchActivePropToFilter()) {
          renderWarehouseConfigModal();
          const nextKeyword = els.purchaseModal.querySelector("[data-batch-prop-keyword]");
          if (nextKeyword) {
            nextKeyword.focus();
            nextKeyword.setSelectionRange(nextKeyword.value.length, nextKeyword.value.length);
          }
          return;
        }
        const list = els.purchaseModal.querySelector("[data-batch-prop-list]");
        if (list) list.innerHTML = renderWarehouseBatchPropList();
        return;
      }

      const storeKeyword = event.target.closest("[data-batch-store-keyword]");
      if (storeKeyword && state.activeWarehouseConfig) {
        state.activeWarehouseConfig.storeKeyword = storeKeyword.value;
        const options = els.purchaseModal.querySelector("[data-batch-store-filter-options]");
        if (options) options.innerHTML = renderWarehouseBatchStoreFilterOptions();
        syncWarehouseBatchStoreFilterAllState();
        return;
      }

      const batchValue = event.target.closest("[data-batch-value]");
      if (batchValue && state.activeWarehouseConfig) {
        state.activeWarehouseConfig.batchValues[batchValue.dataset.batchValue] = batchValue.value;
        return;
      }

      const batchRowField = event.target.closest("[data-batch-row-field]");
      if (batchRowField && state.activeWarehouseConfig) {
        updateWarehouseBatchRowField(batchRowField);
        return;
      }

      const field = event.target.closest("[data-config-field]");
      if (!field || !state.activePurchase) return;
      const { warehouseCode, propType, propName } = state.activePurchase;
      const configKey = propConfigKey(warehouseCode, propType, propName);
      const storeId = field.dataset.storeId;
      if (!state.storePropConfigs[configKey]) state.storePropConfigs[configKey] = {};
      if (!state.storePropConfigs[configKey][storeId]) state.storePropConfigs[configKey][storeId] = {};
      state.storePropConfigs[configKey][storeId][field.dataset.configField] = field.dataset.configField === "qty"
        ? Number(field.value || 0)
        : field.value;
    });

    els.detailPanel.addEventListener("input", event => {
      const keywordInput = event.target.closest("[data-non-standard-keyword]");
      if (keywordInput) {
        state.nonStandardKeyword = keywordInput.value;
        renderDetail();
        return;
      }
      const propKeyword = event.target.closest("[data-inline-prop-keyword]");
      if (propKeyword && state.activeWarehouseConfig?.mode === "inline") {
        state.activeWarehouseConfig.propKeyword = propKeyword.value;
        if (syncWarehouseBatchActivePropToFilter()) {
          render();
          const nextKeyword = els.detailPanel.querySelector("[data-inline-prop-keyword]");
          if (nextKeyword) {
            nextKeyword.focus();
            nextKeyword.setSelectionRange(nextKeyword.value.length, nextKeyword.value.length);
          }
          return;
        }
        const list = els.detailPanel.querySelector(".inline-prop-list");
        if (list) list.innerHTML = renderWarehouseInlinePropCards();
        return;
      }
      const storeKeyword = event.target.closest("[data-inline-store-keyword]");
      if (storeKeyword && state.activeWarehouseConfig?.mode === "inline") {
        state.activeWarehouseConfig.storeKeyword = storeKeyword.value;
        const options = els.detailPanel.querySelector("[data-inline-store-filter-options]");
        if (options) options.innerHTML = renderWarehouseBatchStoreFilterOptions();
        syncWarehouseBatchStoreFilterAllState(els.detailPanel);
        return;
      }
      const qtyInput = event.target.closest("[data-store-purchase-qty]");
      if (!qtyInput) return;
      const qty = Number(qtyInput.value);
      if (Number.isInteger(qty) && qty >= 1) {
        state.storeGroupPurchaseQty[qtyInput.dataset.storePurchaseQty] = qty;
      }
    });

    els.detailPanel.addEventListener("change", event => {
      const qtyInput = event.target.closest("[data-store-purchase-qty]");
      if (!qtyInput) return;
      const qty = Number(qtyInput.value);
      if (!Number.isInteger(qty) || qty < 1) {
        qtyInput.value = state.storeGroupPurchaseQty[qtyInput.dataset.storePurchaseQty] ?? 1;
        showToast("采购仓位数请输入大于0的整数");
        return;
      }
      state.storeGroupPurchaseQty[qtyInput.dataset.storePurchaseQty] = qty;
    });

    els.purchaseModal.addEventListener("change", event => {
      const propTypeFilter = event.target.closest("[data-batch-prop-type-filter]");
      if (propTypeFilter && state.activeWarehouseConfig) {
        state.activeWarehouseConfig.propPurchaseTypeFilter = propTypeFilter.value;
        syncWarehouseBatchActivePropToFilter();
        renderWarehouseConfigModal();
        return;
      }

      const storeFilterAll = event.target.closest("[data-batch-store-filter-all]");
      if (storeFilterAll && state.activeWarehouseConfig) {
        const active = state.activeWarehouseConfig;
        const filterIds = new Set(active.storeFilterIdsByType[active.activePropType] || []);
        getWarehouseBatchStoreSearchResults().forEach(store => {
          if (storeFilterAll.checked) filterIds.add(store.id);
          else filterIds.delete(store.id);
        });
        active.storeFilterIdsByType[active.activePropType] = [...filterIds];
        resetWarehouseBatchFields();
        active.storeFilterOpen = true;
        renderWarehouseConfigModal();
        return;
      }

      const storeFilterItem = event.target.closest("[data-batch-store-filter-item]");
      if (storeFilterItem && state.activeWarehouseConfig) {
        const active = state.activeWarehouseConfig;
        const filterIds = new Set(active.storeFilterIdsByType[active.activePropType] || []);
        if (storeFilterItem.checked) filterIds.add(storeFilterItem.dataset.batchStoreFilterItem);
        else filterIds.delete(storeFilterItem.dataset.batchStoreFilterItem);
        active.storeFilterIdsByType[active.activePropType] = [...filterIds];
        resetWarehouseBatchFields();
        active.storeFilterOpen = true;
        renderWarehouseConfigModal();
        return;
      }

      const batchEnable = event.target.closest("[data-batch-enable]");
      if (batchEnable && state.activeWarehouseConfig) {
        const active = state.activeWarehouseConfig;
        active.batchEnabled[batchEnable.dataset.batchEnable] = batchEnable.checked;
        active.batchNotice = "";
        const control = batchEnable.closest(".batch-field")?.querySelector("[data-batch-value]");
        if (control) {
          control.disabled = !batchEnable.checked;
          if (batchEnable.checked) control.focus();
        }
        const applyButton = els.purchaseModal.querySelector("[data-batch-apply]");
        if (applyButton) {
          applyButton.disabled = !getWarehouseBatchSelectedStoreIds().length || !Object.values(active.batchEnabled).some(Boolean);
        }
        return;
      }

      const batchStoreAll = event.target.closest("[data-batch-store-all]");
      if (batchStoreAll && state.activeWarehouseConfig) {
        const active = state.activeWarehouseConfig;
        const selected = new Set(active.selectedStoreIdsByType[active.activePropType] || []);
        getWarehouseBatchVisibleStoreIds().forEach(storeId => {
          if (batchStoreAll.checked) selected.add(storeId);
          else selected.delete(storeId);
        });
        active.selectedStoreIdsByType[active.activePropType] = [...selected];
        if (!Object.values(active.batchEnabled).some(Boolean)) resetWarehouseBatchFields();
        renderWarehouseConfigModal();
        return;
      }

      const batchStore = event.target.closest("[data-batch-store]");
      if (batchStore && state.activeWarehouseConfig) {
        const active = state.activeWarehouseConfig;
        const selected = new Set(active.selectedStoreIdsByType[active.activePropType] || []);
        if (batchStore.checked) selected.add(batchStore.dataset.batchStore);
        else selected.delete(batchStore.dataset.batchStore);
        active.selectedStoreIdsByType[active.activePropType] = [...selected];
        if (!Object.values(active.batchEnabled).some(Boolean)) resetWarehouseBatchFields();
        renderWarehouseConfigModal();
        return;
      }

      const batchValue = event.target.closest("[data-batch-value]");
      if (batchValue && state.activeWarehouseConfig) {
        state.activeWarehouseConfig.batchValues[batchValue.dataset.batchValue] = batchValue.value;
        return;
      }

      const batchRowField = event.target.closest("[data-batch-row-field]");
      if (batchRowField && state.activeWarehouseConfig) {
        updateWarehouseBatchRowField(batchRowField);
        renderWarehouseConfigModal();
        return;
      }

      const storeInput = event.target.closest("[data-non-standard-store]");
      if (storeInput && state.activeNonStandardAdd) {
        const selected = new Set(state.activeNonStandardAdd.storeIds || []);
        if (storeInput.checked) selected.add(storeInput.value);
        else selected.delete(storeInput.value);
        state.activeNonStandardAdd.storeIds = [...selected];
        const label = els.purchaseModal.querySelector("[data-store-select-label]");
        if (label) {
          label.textContent = state.activeNonStandardAdd.storeIds.length
            ? stores.filter(store => state.activeNonStandardAdd.storeIds.includes(store.id)).map(store => store.storeName).join("、")
            : "请选择采购门店";
        }
        return;
      }

      const unitSelect = event.target.closest('[data-non-standard-field="unit"]');
      if (unitSelect && state.activeNonStandardAdd) {
        const suffix = els.purchaseModal.querySelector("[data-non-standard-qty-unit]");
        if (suffix) suffix.textContent = unitSelect.value || "";
        return;
      }

      const imageInput = event.target.closest('[data-non-standard-field="imageName"]');
      if (imageInput && state.activeNonStandardAdd) {
        const file = imageInput.files?.[0];
        if (!file) return;
        const nameEl = els.purchaseModal.querySelector("#nonStandardImageName");
        const previewEl = els.purchaseModal.querySelector("#nonStandardImagePreview");
        if (nameEl) nameEl.textContent = file.name;
        if (previewEl) {
          const reader = new FileReader();
          reader.onload = () => {
            previewEl.innerHTML = `<img src="${reader.result}" alt="">`;
          };
          reader.readAsDataURL(file);
        }
        return;
      }

      const field = event.target.closest("[data-config-field]");
      if (!field || !state.activePurchase) return;
      const { warehouseCode, propType, propName } = state.activePurchase;
      const configKey = propConfigKey(warehouseCode, propType, propName);
      const storeId = field.dataset.storeId;
      if (!state.storePropConfigs[configKey]) state.storePropConfigs[configKey] = {};
      if (!state.storePropConfigs[configKey][storeId]) state.storePropConfigs[configKey][storeId] = {};
      state.storePropConfigs[configKey][storeId][field.dataset.configField] = field.dataset.configField === "qty"
        ? Number(field.value || 0)
        : field.value;
    });

    const initialDraftId = new URLSearchParams(window.location.search).get("draftId");
    if (initialDraftId) restoreDraft(initialDraftId);
    else render();
  </script>
</body>
</html>
