<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓位采购优化方案</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #1f2937;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    main {
      width: min(960px, calc(100% - 32px));
      margin: 48px auto;
    }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; }
    .intro { margin: 0 0 24px; color: #6b7280; }
    .list { display: grid; gap: 12px; }
    .item {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px;
      color: inherit;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid #d9dee7;
      border-radius: 6px;
    }
    .item:hover { border-color: #527df7; }
    .number {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: #ffffff;
      background: #527df7;
      border-radius: 50%;
      font-weight: 600;
    }
    .name { display: block; margin-bottom: 4px; font-weight: 600; }
    .description { color: #6b7280; font-size: 14px; }
    .arrow { color: #527df7; font-size: 22px; }
    @media (max-width: 640px) {
      main { margin: 28px auto; }
      .item { grid-template-columns: 36px 1fr; }
      .arrow { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>仓位采购优化方案</h1>
    <p class="intro">选择方案查看完整交互原型。</p>
    <nav class="list" aria-label="方案列表">
      <a class="item" href="positionPurchase.html">
        <span class="number">1</span>
        <span><span class="name">仓位标准道具支持修改</span><span class="description">保留原流程，补充单项调整和仓位级批量配置。</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="item" href="positionPurchaseDemo.html">
        <span class="number">2</span>
        <span><span class="name">仓位采购交互优化 demo</span><span class="description">将门店选择、道具配置和批量调整集中到同一页面。</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="item" href="positionPurchaseExperienceDemo.html">
        <span class="number">3</span>
        <span><span class="name">仓位采购交互优化 demo（2）</span><span class="description">增加按门店校对、采购汇总和下单前异常检查。</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>
  </main>
</body>
</html>
