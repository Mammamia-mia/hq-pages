.form-range::-moz-range-track {

&lt;script&gt;
(() =&gt; {

    dialog.querySelector(&quot;[data-close=&#x27;calculation-salary-adjust-dialog&#x27;]&quot;)?.addEventListener(&quot;click&quot;, event =&gt; {
      event.preventDefault();
      dialog.close();
    });
    dialog.querySelector(&quot;[data-calc-salary-save]&quot;)?.addEventListener(&quot;click&quot;, () =&gt; {
      // Existing save handlers update the salary drafts and linked tables first.
      requestAnimationFrame(() =&gt; { if (dialog.open) dialog.close(); });
    });

    const adjustedSalaryValues = new Map();
    const formatAmount = value =&gt; `¥ ${Number(value).toLocaleString(&quot;zh-CN&quot;, { minimumFractionDigits: Number(value) % 1 ? 2 : 0, maximumFractionDigits: 2 })}`;
    const columnIndexes = table =&gt; new Map([...table.tHead.rows[0].cells].map((cell, index) =&gt; [cell.textContent.trim(), index]));
    const parseAmount = value =&gt; Number(String(value).replace(/[^\d.-]/g, &quot;&quot;).replaceAll(&quot;,&quot;, &quot;&quot;)) || 0;
    const updateAmounts = (table, personName, amounts) =&gt; {
      if (!table) return;
      const row = [...table.tBodies[0].rows].find(item =&gt; item.cells[1]?.textContent.trim() === personName);
      if (!row) return;
      const columns = columnIndexes(table);
      [[&quot;固定薪酬&quot;, amounts.fixed], [&quot;浮动薪酬&quot;, amounts.floating], [&quot;其他奖金/津贴&quot;, amounts.other], [&quot;月度工资总额&quot;, amounts.grand]].forEach(([name, value]) =&gt; {
        if (!columns.has(name)) return;
        const cell = row.cells[columns.get(name)];
        const original = Number(cell.dataset.calculationOriginalAmount ?? parseAmount(cell.querySelector(&quot;.amount-with-delta &gt; span&quot;)?.textContent ?? cell.textContent));
        cell.dataset.calculationOriginalAmount = String(original);
        cell.dataset.calculationAmount = String(value);
        if (table !== review.querySelector(&quot;table&quot;) || name === &quot;月度工资总额&quot; || original === value) { cell.textContent = formatAmount(value); return; }
        const delta = value - original;
        const deltaText = `${delta &gt; 0 ? &quot;+&quot; : &quot;-&quot;}¥${Math.abs(delta).toLocaleString(&quot;zh-CN&quot;)}`;
        cell.innerHTML = `&lt;div class=&quot;amount-with-delta&quot;&gt;&lt;span&gt;${formatAmount(value)}&lt;/span&gt;&lt;span class=&quot;amount-delta ${delta &gt; 0 ? &quot;is-increase&quot; : &quot;is-decrease&quot;}&quot;&gt;${deltaText}&lt;/span&gt;&lt;/div&gt;`;

    window.addEventListener(&quot;click&quot;, event =&gt; {

      const totals = [values.slice(0, 4), values.slice(4, 7), values.slice(7)].map(group =&gt; group.reduce((sum, value) =&gt; sum + value, 0));
      detailDialog.querySelectorAll(&quot;.salary-line.is-total strong&quot;).forEach((amount, index) =&gt; { amount.textContent = formatAmount(totals[index]); });
      const grandTotal = detailDialog.querySelector(&quot;.salary-grand-total strong&quot;);

  if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, () =&gt; window.setTimeout(initialize, 0), { once:true });
  else window.setTimeout(initialize, 0);
})();

&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    const root = document.getElementById(&quot;salary-suite-demo&quot;);
    const detailView = root?.querySelector(&quot;#view-salary-calculation-detail&quot;);
    const actions = detailView?.querySelector(&quot;.calculation-next-actions&quot;);
    const hrbpView = detailView?.querySelector(&quot;.calculation-review&quot;);
    if (!root || !detailView || !actions || !hrbpView || root.dataset.hrbpRecalculationReady) return;
    root.dataset.hrbpRecalculationReady = &quot;true&quot;;

    const baselineValues = {
      SC202608001: [2200, 2800, 200, 0, 6735, 0, 500, 0, 300],
      SC202608002: [2000, 3800, 300, 0, 6685, 3300, 600, 0, 500],
      SC202608003: [2000, 2600, 200, 0, 4340, 0, 500, 0, 0],
      SC202608004: [2800, 3300, 400, 0, 0, 0, 0, 0, 400]
    };
    const recalculatedAdjustmentCounts = {};
    const recalculatedAdjustmentHistories = {};
    let hasRecalculated = false;
    const formatAmount = value =&gt; `¥ ${Number(value).toLocaleString(&quot;zh-CN&quot;, { minimumFractionDigits: Number(value) % 1 ? 2 : 0, maximumFractionDigits: 2 })}`;
    const getTotals = values =&gt; ({
      fixed: values.slice(0, 4).reduce((sum, value) =&gt; sum + value, 0),
      floating: values.slice(4, 7).reduce((sum, value) =&gt; sum + value, 0),
      other: values.slice(7).reduce((sum, value) =&gt; sum + value, 0)
    });
    const recalculateButton = document.createElement(&quot;button&quot;);
    recalculateButton.className = &quot;btn action-outline&quot;;
    recalculateButton.type = &quot;button&quot;;
    recalculateButton.dataset.hrbpRecalculate = &quot;true&quot;;
    recalculateButton.innerHTML = '&lt;i data-lucide=&quot;rotate-ccw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;重新核算';
    const confirmDialog = document.createElement(&quot;dialog&quot;);
    confirmDialog.id = &quot;hrbp-recalculate-dialog&quot;;
    confirmDialog.innerHTML = '&lt;div class=&quot;dialog-head&quot;&gt;&lt;h2&gt;重新核算&lt;/h2&gt;&lt;button class=&quot;icon-btn&quot; type=&quot;button&quot; data-hrbp-recalculate-cancel aria-label=&quot;关闭&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;dialog-body&quot;&gt;&lt;p&gt;确定后将清空全部调整，确定重新核算&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;dialog-foot&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-hrbp-recalculate-cancel&gt;取消&lt;/button&gt;&lt;button class=&quot;btn action-primary&quot; type=&quot;button&quot; data-hrbp-recalculate-confirm&gt;确定重新核算&lt;/button&gt;&lt;/div&gt;';
    root.append(confirmDialog);

    const syncRecalculateButton = () =&gt; {
      const isHrbpStage = Number(detailView.dataset.workflowStage) === 1;
      recalculateButton.hidden = !isHrbpStage;
      if (isHrbpStage &amp;&amp; recalculateButton.parentElement !== actions) actions.prepend(recalculateButton);
      globalThis.lucide?.createIcons({ attrs:{ width:16, height:16 } });
    };
    new MutationObserver(() =&gt; queueMicrotask(syncRecalculateButton)).observe(actions, { childList:true });
    new MutationObserver(() =&gt; queueMicrotask(syncRecalculateButton)).observe(detailView, { attributes:true, attributeFilter:[&quot;data-workflow-stage&quot;] });

    const resetHrbpAdjustments = () =&gt; {
      Object.keys(recalculatedAdjustmentCounts).forEach(code =&gt; delete recalculatedAdjustmentCounts[code]);
      Object.keys(recalculatedAdjustmentHistories).forEach(code =&gt; delete recalculatedAdjustmentHistories[code]);
      const table = hrbpView.querySelector(&quot;table&quot;);
      const headers = [...table.tHead.rows[0].cells].map(cell =&gt; cell.textContent.trim());
      const amountColumns = { &quot;固定薪酬&quot;:&quot;fixed&quot;, &quot;浮动薪酬&quot;:&quot;floating&quot;, &quot;其他奖金/津贴&quot;:&quot;other&quot;, &quot;月度工资总额&quot;:&quot;grand&quot; };
      [...table.tBodies[0].rows].forEach(row =&gt; {
        const values = baselineValues[row.cells[0].textContent.trim()];
        if (!values) return;
        const totals = getTotals(values);
        Object.entries(amountColumns).forEach(([label, key]) =&gt; {
          const index = headers.indexOf(label);
          if (index &gt; -1) row.cells[index].textContent = formatAmount(key === &quot;grand&quot; ? totals.fixed + totals.floating + totals.other : totals[key]);
        });
        row.dataset.calcAdjusted = &quot;否&quot;;
        row.querySelector(&quot;[data-calc-adjustment-history]&quot;)?.replaceChildren(&quot;0次&quot;);
      });
      root.querySelectorAll(&quot;#calculation-salary-adjust-dialog, #calculation-adjustment-reason-dialog&quot;).forEach(dialog =&gt; { if (dialog.open) dialog.close(); });
    };

    recalculateButton.addEventListener(&quot;click&quot;, () =&gt; { confirmDialog.showModal(); globalThis.lucide?.createIcons({ attrs:{ width:16, height:16 } }); });
    confirmDialog.querySelectorAll(&quot;[data-hrbp-recalculate-cancel]&quot;).forEach(button =&gt; button.addEventListener(&quot;click&quot;, () =&gt; confirmDialog.close()));
    confirmDialog.querySelector(&quot;[data-hrbp-recalculate-confirm]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      hasRecalculated = true;
      resetHrbpAdjustments();
      root.dispatchEvent(new CustomEvent(&quot;salary-recalculated&quot;));
      confirmDialog.close();
      detailView.__fiveStageWorkflow?.goToStage(0);
      syncRecalculateButton();
      const toast = root.querySelector(&quot;#toast&quot;);
      root.querySelector(&quot;#toast-text&quot;).textContent = &quot;已清空全部调整，已返回数据准备&quot;;
      toast.classList.add(&quot;is-visible&quot;);
    });

    root.addEventListener(&quot;click&quot;, event =&gt; {
      const adjustButton = event.target.closest?.(&quot;[data-calc-review-adjust]&quot;);
      if (!hasRecalculated || !adjustButton) return;
      const values = baselineValues[adjustButton.dataset.calcReviewAdjust];
      if (!values) return;
      queueMicrotask(() =&gt; {
        const dialog = root.querySelector(&quot;#calculation-salary-adjust-dialog&quot;);
        dialog.querySelectorAll(&quot;[data-calc-salary-value]&quot;).forEach((input, index) =&gt; { input.value = values[index]; input.dispatchEvent(new Event(&quot;input&quot;, { bubbles:true })); });
        dialog.dataset.adjustmentBeforeValues = JSON.stringify(values);
      });
    });
    root.addEventListener(&quot;calculation-adjustment-applied&quot;, event =&gt; {
      if (!hasRecalculated) return;
      const { code, entries } = event.detail || {};
      if (!code || !entries?.length) return;
      recalculatedAdjustmentCounts[code] = (recalculatedAdjustmentCounts[code] || 0) + 1;
      (recalculatedAdjustmentHistories[code] ||= []).unshift(...entries.slice().reverse());
      const row = [...hrbpView.querySelectorAll(&quot;tbody tr&quot;)].find(item =&gt; item.cells[0].textContent.trim() === code);
      if (row) { row.dataset.calcAdjusted = &quot;是&quot;; row.querySelector(&quot;[data-calc-adjustment-history]&quot;).textContent = `${recalculatedAdjustmentCounts[code]}次`; }
    });
    root.addEventListener(&quot;click&quot;, event =&gt; {
      const historyButton = event.target.closest?.(&quot;[data-calc-adjustment-history]&quot;);
      if (!hasRecalculated || !historyButton || !hrbpView.contains(historyButton)) return;
      event.stopImmediatePropagation();
      const code = historyButton.dataset.calcAdjustmentHistory;
      const row = historyButton.closest(&quot;tr&quot;);
      const entries = recalculatedAdjustmentHistories[code] || [];
      const dialog = root.querySelector(&quot;#calculation-adjustment-history-dialog&quot;);
      dialog.innerHTML = `&lt;div class=&quot;dialog-head&quot;&gt;&lt;h2&gt;${row?.cells[1].textContent.trim() || &quot;&quot;} 调整记录&lt;/h2&gt;&lt;button class=&quot;icon-btn&quot; type=&quot;button&quot; data-hrbp-history-close aria-label=&quot;关闭&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;dialog-body&quot;&gt;&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;调整人&lt;/th&gt;&lt;th&gt;调整时间&lt;/th&gt;&lt;th&gt;调整原因&lt;/th&gt;&lt;th&gt;调整项&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;修改前&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;修改后&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${entries.length ? entries.map(entry =&gt; `&lt;tr&gt;&lt;td&gt;${entry.operator}&lt;/td&gt;&lt;td&gt;${entry.time}&lt;/td&gt;&lt;td&gt;${entry.reason}&lt;/td&gt;&lt;td&gt;${entry.item}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${entry.before}&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${entry.after}&lt;/td&gt;&lt;/tr&gt;`).join(&quot;&quot;) : '&lt;tr&gt;&lt;td colspan=&quot;6&quot; class=&quot;empty&quot;&gt;暂无调整记录&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dialog-foot&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-hrbp-history-close&gt;关闭&lt;/button&gt;&lt;/div&gt;`;
      dialog.querySelectorAll(&quot;[data-hrbp-history-close]&quot;).forEach(button =&gt; button.addEventListener(&quot;click&quot;, () =&gt; dialog.close()));
      dialog.showModal(); globalThis.lucide?.createIcons({ attrs:{ width:16, height:16 } });
    }, true);
    syncRecalculateButton();
  };
  if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, () =&gt; window.setTimeout(initialize, 0), { once:true });
  else window.setTimeout(initialize, 0);
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    const root = document.getElementById(&quot;salary-suite-demo&quot;);
    const table = root?.querySelector(&quot;#view-performance table&quot;);
    if (!root || !table || root.dataset.managerCommissionFormulaReady) return;
    root.dataset.managerCommissionFormulaReady = &quot;true&quot;;

    const toNumber = value =&gt; Number(String(value || &quot;&quot;).replace(/[^0-9.-]/g, &quot;&quot;)) || 0;
    const toPercent = value =&gt; Number(String(value || &quot;&quot;).replace(/[^0-9.-]/g, &quot;&quot;)) || 0;
    const formatAmount = value =&gt; `¥ ${Number(value).toLocaleString(&quot;zh-CN&quot;, { minimumFractionDigits:0, maximumFractionDigits:2 })}`;
    const parseTiers = value =&gt; String(value || &quot;&quot;).split(&quot;；&quot;).map(item =&gt; {
      const [range, rateText] = item.split(&quot;：&quot;); const rate = toPercent(rateText) / 100;
      if (!range) return null;
      if (range.trim() === &quot;超额&quot;) return { start:100, end:Infinity, rate };
      if (range.trim().startsWith(&quot;&lt;&quot;)) return { start:0, end:toPercent(range.slice(1)), rate };
      const [startText, endText = &quot;&quot;] = range.replace(/[≥=&gt;]/g, &quot;&quot;).split(&quot;-&quot;);
      return { start:toPercent(startText), end:endText ? toPercent(endText) : Infinity, rate };
    }).filter(Boolean).sort((left, right) =&gt; left.start - right.start);
    const resolveTier = (achievement, tiers) =&gt; {
      const percentage = achievement * 100;
      return tiers.find(tier =&gt; percentage &gt;= tier.start &amp;&amp; percentage &lt;= tier.end) || tiers[tiers.length - 1];
    };
    const roundAmount = value =&gt; Math.round((value + Number.EPSILON) * 100) / 100;
    const calculateTierCommission = ({ sales, target, tiers }) =&gt; {
      if (!(sales &gt; 0) || !(target &gt; 0) || !tiers.length) return 0;
      const activeTier = resolveTier(sales / target, tiers);
      if (!activeTier) return 0;
      if (activeTier.start &lt; 100) return roundAmount(sales * activeTier.rate);
      const activeIndex = tiers.indexOf(activeTier);
      const previousRate = tiers[activeIndex - 1]?.rate ?? activeTier.rate;
      return roundAmount(Math.max(0, sales - target) * activeTier.rate + target * previousRate);
    };
    root.calculateManagerCommission = calculateTierCommission;

    const recalculateManagerCommissions = () =&gt; {
      const headers = [...table.tHead.rows[0].cells].map(cell =&gt; cell.textContent.trim());
      const indexOf = label =&gt; headers.indexOf(label);
      const indexes = {
        role:indexOf(&quot;岗位&quot;), category:indexOf(&quot;门店类别&quot;), storeTarget:indexOf(&quot;门店POS目标&quot;), storeSales:indexOf(&quot;门店POS业绩&quot;), personalTarget:indexOf(&quot;个人POS目标&quot;), personalSales:indexOf(&quot;个人POS业绩&quot;)
      };
      if (Object.values(indexes).some(index =&gt; index &lt; 0)) return;
      const personalTierText = root.commissionConfigData?.person?.[0]?.[0];
      [...table.tBodies[0].rows].forEach(row =&gt; {
        if (row.cells[indexes.role]?.textContent.trim() !== &quot;店长&quot;) return;
        const category = row.cells[indexes.category]?.textContent.trim();
        const mode = root.managerCommissionModes?.find(item =&gt; item.category === category);
        const storeConfig = root.commissionConfigData?.store?.find(item =&gt; item[0] === category);
        const storeTiers = parseTiers(storeConfig?.[1]); const personalTiers = parseTiers(personalTierText);
        const storeCommission = mode?.configured &amp;&amp; mode.store ? calculateTierCommission({ sales:toNumber(row.cells[indexes.storeSales]?.textContent), target:toNumber(row.cells[indexes.storeTarget]?.textContent), tiers:storeTiers }) : 0;
        const personalCommission = mode?.configured &amp;&amp; mode.person ? calculateTierCommission({ sales:toNumber(row.cells[indexes.personalSales]?.textContent), target:toNumber(row.cells[indexes.personalTarget]?.textContent), tiers:personalTiers }) : 0;
        row.querySelector(&quot;.store-commission&quot;).textContent = formatAmount(storeCommission);
        row.querySelector(&quot;.personal-commission&quot;).textContent = formatAmount(personalCommission);
        row.querySelector(&quot;.commission-total&quot;).textContent = formatAmount(storeCommission + personalCommission);
        row.dataset.managerCommissionFormula = &quot;已按店长提点模式回算&quot;;
      });
    };
    root.addEventListener(&quot;manager-commission-mode-changed&quot;, recalculateManagerCommissions);
    recalculateManagerCommissions();
  };
  if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, () =&gt; window.setTimeout(initialize, 0), { once:true });
  else window.setTimeout(initialize, 0);
})();
&lt;/script&gt;
